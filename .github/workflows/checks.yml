name: HRMS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: hrms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HRMS_DATABASE_URL: postgresql+asyncpg://hrms:test-password@localhost:5432/hrms_test
      HRMS_TEST_DATABASE_URL: postgresql+asyncpg://hrms:test-password@localhost:5432/hrms_test
      HRMS_DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The versions in uv.lock, not "whatever pip resolves today".
      - run: pip install uv==0.12.17
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check src tests
      - run: mypy src
      # Known vulnerabilities in the locked production dependencies fail the build.
      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --progress-spinner off
      - run: alembic upgrade head
      # Fails if a model field, table or constraint has no migration (and only then — see
      # src/hrms/alembic_hooks.py for what is deliberately not compared).
      - run: alembic check
      - run: pytest -q
      - name: Verify the recent migrations roll back and reapply
        run: |
          alembic downgrade 0016
          alembic upgrade head
          alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The deployed stack (deploy/compose.yml) from freshly built images: health, hidden docs,
  # metrics token, CORS, the app role's password, the jobs, the web config and a backup that
  # restores. What testing and production run is exactly what this proves.
  deploy-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/smoke-test.sh
