name: HRMS checks
# No push trigger: pull requests cover feature branches, release.yml and deploy-testing-ec2.yml
# call this workflow for main and testing. A push trigger only ran every job a second time.
on:
  pull_request:
  workflow_call:
    inputs:
      postgres_image:
        description: PostgreSQL image for the isolated backend and browser databases
        type: string
        default: postgres:16-alpine
permissions:
  contents: read
# A newer push to a pull request supersedes the run in flight. Called runs (release, testing
# deploy) are never cancelled; github.workflow is the caller's name there, so no group clash.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ inputs.postgres_image || 'postgres:16-alpine' }}
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: hrms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HRMS_DATABASE_URL: postgresql+asyncpg://hrms:test-password@localhost:5432/hrms_test
      HRMS_TEST_DATABASE_URL: postgresql+asyncpg://hrms:test-password@localhost:5432/hrms_test
      HRMS_DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The versions in uv.lock, not "whatever pip resolves today".
      - run: pip install uv==0.12.17
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check src tests
      - run: mypy src
      # Known vulnerabilities in the locked production dependencies fail the build.
      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --progress-spinner off
      - run: alembic upgrade head
      # Fails if a model field, table or constraint has no migration (and only then — see
      # src/hrms/alembic_hooks.py for what is deliberately not compared).
      - run: alembic check
      # Irreversible data migrations retain their schema during a code rollback.
      # Exercise reversible migrations on a separate database, then a populated upgrade.
      - name: Verify migration upgrade and rollback boundaries
        run: python scripts/check_migrations.py
      # Coverage below [tool.coverage.report] fail_under fails the build.
      - run: pytest -q --cov --cov-report=term
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The deployed stack (deploy/compose.yml) from freshly built images: health, hidden docs,
  # metrics token, CORS, the app role's password, the jobs, the web config and a backup that
  # restores. What testing and production run is exactly what this proves.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: ${{ inputs.postgres_image || 'postgres:16-alpine' }}
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: hrms_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HRMS_DATABASE_URL: postgresql+asyncpg://hrms:test-password@localhost:5432/hrms_browser_test
      HRMS_E2E_DATABASE_URL: postgresql+asyncpg://hrms:test-password@localhost:5432/hrms_browser_test
      HRMS_E2E_APP_DATABASE_URL: postgresql+asyncpg://hrms_app:hrms_app_dev_password@localhost:5432/hrms_browser_test
      HRMS_E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install uv==0.12.17
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: echo "$PWD/backend/.venv/bin" >> "$GITHUB_PATH"
      - run: alembic upgrade head
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
          retention-days: 7

  deploy-smoke:
    needs: [backend, frontend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: deploy/smoke-test.sh
