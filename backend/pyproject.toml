[project]
name = "hrms-platform"
version = "0.1.4"
description = "HRMS Platform — multi-tenant HR SaaS backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # PyJWT, not python-jose: maintained, and no ecdsa dependency (PYSEC-2026-1325).
    "PyJWT>=2.10",
    # AES-256-GCM for personal identifiers at rest (core/field_crypto.py).
    "cryptography>=44",
    # S3 backend for uploaded documents (HRMS_DOCUMENT_STORAGE=s3, core/document_store.py).
    "boto3>=1.35",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "uuid7>=0.1.0",
    "sentry-sdk[fastapi]>=2.19",
    "prometheus-client>=0.21",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrms"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.File", "fastapi.Form", "hrms.core.platform_authz.require_platform_role"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# A realistic baseline rather than `strict`: this codebase is mostly unannotated by design, so the
# annotation-completeness rules only produce noise. What is checked is what finds bugs — None
# dereferences, wrong argument types, bad assignments, unused ignores — everywhere except the
# legacy modules listed below. `mypy src` runs in CI; remove a module from the list when you fix it.
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true

# Packages that ship no type information.
[[tool.mypy.overrides]]
module = ["uuid_extensions", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "database: isolated PostgreSQL tests",
    "live_demo: opt-in tests that mutate seeded demo data",
    "serial: needs the whole Postgres cluster to itself (pg_snapshot_xmin is cluster-wide); left out of the parallel pass, run with -m serial",
]

[tool.coverage.run]
source = ["hrms"]
# SQLAlchemy's async layer switches through greenlets; without this, coverage stops tracing a
# coroutine at its first database await and reports about half of what the tests execute.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# CI fails below this (measured 91% on 2026-10-03). Raise it as coverage grows; don't lower it.
fail_under = 88
skip_covered = true
