server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /tmp/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;


    location = /healthz { access_log off; return 200 "ok\n"; }

    # Per-environment settings: never cached, so a config change applies on the next load.
    location = /config.js {
        alias /tmp/config.js;
        include /tmp/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Content-hashed bundles: cache for a year.
    location /assets/ {
        include /tmp/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The single-page app: every other path is index.html, which must not be cached.
    location / {
        include /tmp/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
