<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Configuration resolves from the most general layer to the most specific; the most specific layer that sets a value wins, so two employees of the same tenant can get different values." font-family="'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5e67"/></marker></defs><rect x="0.5" y="0.5" width="999" height="439" rx="10" fill="#ffffff" stroke="#d5dde1"/><text x="20" y="30" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Layer (general → specific)</text><text x="420" y="30" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Grace period set here</text><rect x="20" y="44" width="370" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="32" y="66.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Platform default</text><rect x="420" y="44" width="120" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="480.0" y="66.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">0 min</text><rect x="20" y="90" width="370" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="32" y="112.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Country pack · India</text><rect x="420" y="90" width="120" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="480.0" y="112.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">—</text><rect x="20" y="136" width="370" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="32" y="158.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Industry pack · Manufacturing</text><rect x="420" y="136" width="120" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="480.0" y="158.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">5 min</text><rect x="20" y="182" width="370" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="32" y="204.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Tenant · Kaveri Group</text><rect x="420" y="182" width="120" height="36" rx="6" fill="#ddeaea" stroke="#0d6b6b" stroke-width="1.25"/><text x="480.0" y="204.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">10 min</text><rect x="20" y="228" width="370" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="32" y="250.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Company · Kaveri Polymers</text><rect x="420" y="228" width="120" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="480.0" y="250.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">—</text><rect x="20" y="274" width="370" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="32" y="296.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Location · Vadodara Plant</text><rect x="420" y="274" width="120" height="36" rx="6" fill="#ddeaea" stroke="#0d6b6b" stroke-width="1.25"/><text x="480.0" y="296.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">5 min</text><rect x="20" y="320" width="370" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="32" y="342.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Employee group · Shift workers</text><rect x="420" y="320" width="120" height="36" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="480.0" y="342.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">—</text><text x="20" y="420" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="start">Most specific published value wins · the effective date picks the version · a layer can lock a value (e.g. a statutory minimum) so lower layers cannot override it</text><rect x="680" y="120" width="300" height="64" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="830.0" y="148.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Priya · Pune office · Sales</text><text x="830.0" y="164.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">resolves to 10 min (Tenant)</text><rect x="680" y="250" width="300" height="64" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="830.0" y="278.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Imran · Vadodara Plant · shift worker</text><text x="830.0" y="294.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">resolves to 5 min (Location)</text><polyline points="540,200 610,200 610,152 678,152" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="616" y="168" font-size="12" fill="#4f5e67" text-anchor="start">wins for</text><polyline points="540,292 610,292 610,282 678,282" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="616" y="276" font-size="12" fill="#4f5e67" text-anchor="start">wins for</text></svg>