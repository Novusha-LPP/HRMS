<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-label="Container Architecture: Web clients access the FastAPI modular monolith backend, which enforces dual-plane security and PostgreSQL 16 Row-Level Security via dual roles." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff;stroke:#d5dde1}
    .n{fill:#f4f6f7;stroke:#7b8a92}
    .na{fill:#ddeaea;stroke:#0d6b6b}
    .nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}
    .np{fill:#eceff1;stroke:#7b8a92}
    .g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}
    .gs{fill:#f9fbfb;stroke:#9aa7ae}
    .t{fill:#16222a;font-weight:600}
    .s{fill:#4f5e67}
    .ta{fill:#0d6b6b;font-weight:600}
    .tb{fill:#1e40af;font-weight:600}
    .nb{fill:#eff6ff;stroke:#3b82f6}
    .e{fill:none;stroke:#4f5e67;stroke-width:1.5}
    .ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}
    .ah{fill:#4f5e67}
  </style>
  <defs>
    <marker id="ah-containers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0.5" y="0.5" width="1239" height="819" rx="10"/>

  <!-- TOP LAYER: CLIENT SURFACES -->
  <rect class="g" x="20" y="16" width="1200" height="96" rx="8" stroke-width="1.25"/>
  <text class="t" x="34" y="36" font-size="13">Client Layer · React 19 + TypeScript + Vite + Tailwind CSS</text>

  <rect class="np" x="40" y="46" width="340" height="52" rx="12" stroke-width="1.25"/>
  <text class="t" x="210" y="70" font-size="13" text-anchor="middle">Tenant HR &amp; Management Console</text>
  <text class="s" x="210" y="86" font-size="11" text-anchor="middle">Dashboard · Org · People · Policy · Leave · Reports</text>

  <rect class="np" x="450" y="46" width="340" height="52" rx="12" stroke-width="1.25"/>
  <text class="t" x="620" y="70" font-size="13" text-anchor="middle">Employee Self-Service Portal</text>
  <text class="s" x="620" y="86" font-size="11" text-anchor="middle">Daily Attendance · Punch In/Out · Leave Apply · KYC</text>

  <rect class="nb" x="860" y="46" width="340" height="52" rx="12" stroke-width="1.25"/>
  <text class="tb" x="1030" y="70" font-size="13" text-anchor="middle">Platform Admin Console (/platform/*)</text>
  <text class="s" x="1030" y="86" font-size="11" text-anchor="middle">Tenant Provisioning · Company Linking · Audit Log</text>

  <!-- Connection from Clients to Backend -->
  <polyline class="e" points="620,112 620,158" marker-end="url(#ah-containers)"/>
  <text class="s" x="630" y="140" font-size="12" text-anchor="start">HTTPS / REST (JSON) · JWT Bearer Auth · Port 8015</text>

  <!-- MIDDLE LAYER: FASTAPI MODULAR MONOLITH -->
  <rect class="g" x="20" y="160" width="1200" height="370" rx="8" stroke-width="1.25"/>
  <text class="t" x="34" y="184" font-size="14">FastAPI Application · Python 3.12+ (Uvicorn ASGI Server, Port 8015)</text>

  <!-- Platform Control Plane Sub-box -->
  <rect class="nb" x="40" y="200" width="560" height="150" rx="6" stroke-width="1.25"/>
  <text class="tb" x="54" y="224" font-size="13">Platform Control Plane (/v1/platform/*)</text>
  <text class="s" x="54" y="244" font-size="11">Authenticated via separate Platform Token (typ: "platform", platform_admins table)</text>

  <rect class="n" x="54" y="256" width="165" height="42" rx="4"/>
  <text class="t" x="136" y="274" font-size="11" text-anchor="middle">Tenant Provisioning</text>
  <text class="s" x="136" y="289" font-size="10" text-anchor="middle">bootstrap_tenant() logic</text>

  <rect class="n" x="237" y="256" width="165" height="42" rx="4"/>
  <text class="t" x="319" y="274" font-size="11" text-anchor="middle">Company Linking</text>
  <text class="s" x="319" y="289" font-size="10" text-anchor="middle">Multi-Legal Entity Groups</text>

  <rect class="n" x="420" y="256" width="165" height="42" rx="4"/>
  <text class="t" x="502" y="274" font-size="11" text-anchor="middle">Platform Audit Log</text>
  <text class="s" x="502" y="289" font-size="10" text-anchor="middle">Append-only system trail</text>

  <rect class="n" x="54" y="304" width="256" height="34" rx="4"/>
  <text class="s" x="182" y="325" font-size="11" text-anchor="middle">Role Checks: Live DB validation (ADMIN vs VIEWER)</text>

  <rect class="n" x="328" y="304" width="256" height="34" rx="4"/>
  <text class="s" x="456" y="325" font-size="11" text-anchor="middle">Subscription Plans: STARTER, GROWTH, ENTERPRISE</text>

  <!-- Tenant Operations Plane Sub-box -->
  <rect class="na" x="640" y="200" width="560" height="150" rx="6" stroke-width="1.25"/>
  <text class="ta" x="654" y="224" font-size="13">Tenant Operations Plane (/v1/*)</text>
  <text class="s" x="654" y="244" font-size="11">Authenticated via Tenant Access Token (carries tenant_id, user_account_id, employment_id)</text>

  <rect class="n" x="654" y="256" width="128" height="38" rx="4"/>
  <text class="t" x="718" y="273" font-size="11" text-anchor="middle">Org &amp; People</text>
  <text class="s" x="718" y="286" font-size="9" text-anchor="middle">Legal Entities · Trees · ID Schemes</text>

  <rect class="n" x="792" y="256" width="128" height="38" rx="4"/>
  <text class="t" x="856" y="273" font-size="11" text-anchor="middle">Time &amp; Attendance</text>
  <text class="s" x="856" y="286" font-size="9" text-anchor="middle">Punches · Days · Overtime Review</text>

  <rect class="n" x="930" y="256" width="128" height="38" rx="4"/>
  <text class="t" x="994" y="273" font-size="11" text-anchor="middle">Work Policies</text>
  <text class="s" x="994" y="286" font-size="9" text-anchor="middle">4-Tier Fallback · Alternate Sats</text>

  <rect class="n" x="1068" y="256" width="120" height="38" rx="4"/>
  <text class="t" x="1128" y="273" font-size="11" text-anchor="middle">Leave &amp; Comp-Off</text>
  <text class="s" x="1128" y="286" font-size="9" text-anchor="middle">Multi-Tier · Monthly Accruals</text>

  <rect class="n" x="654" y="302" width="128" height="38" rx="4"/>
  <text class="t" x="718" y="319" font-size="11" text-anchor="middle">Employee KYC</text>
  <text class="s" x="718" y="332" font-size="9" text-anchor="middle">Statutory IDs · Doc Verification</text>

  <rect class="n" x="792" y="302" width="128" height="38" rx="4"/>
  <text class="t" x="856" y="319" font-size="11" text-anchor="middle">Corrections</text>
  <text class="s" x="856" y="332" font-size="9" text-anchor="middle">Punches · Auto Recomputation</text>

  <rect class="n" x="930" y="302" width="128" height="38" rx="4"/>
  <text class="t" x="994" y="319" font-size="11" text-anchor="middle">Onboarding</text>
  <text class="s" x="994" y="332" font-size="9" text-anchor="middle">Checklists · Case Workflows</text>

  <rect class="n" x="1068" y="302" width="120" height="38" rx="4"/>
  <text class="t" x="1128" y="319" font-size="11" text-anchor="middle">Reports &amp; Export</text>
  <text class="s" x="1128" y="332" font-size="9" text-anchor="middle">Dynamic Filters · CSV Streaming</text>

  <!-- Core Infrastructure Middlewares & Guards -->
  <rect class="np" x="40" y="364" width="1160" height="150" rx="6" stroke-width="1.25"/>
  <text class="t" x="54" y="388" font-size="13">Core Infrastructure &amp; Security Layer (`backend/src/hrms/core`)</text>

  <rect class="n" x="54" y="402" width="265" height="100" rx="4"/>
  <text class="t" x="186" y="422" font-size="12" text-anchor="middle">Database Session Management</text>
  <text class="s" x="186" y="440" font-size="10" text-anchor="middle">• get_session(tenant_id): asyncpg pool</text>
  <text class="s" x="186" y="456" font-size="10" text-anchor="middle">• Executes: SELECT set_config('app.tenant_id')</text>
  <text class="s" x="186" y="472" font-size="10" text-anchor="middle">• Real-time tenant active status validation</text>
  <text class="s" x="186" y="488" font-size="10" text-anchor="middle">• Suspended tenants cut off immediately</text>

  <rect class="n" x="339" y="402" width="265" height="100" rx="4"/>
  <text class="t" x="471" y="422" font-size="12" text-anchor="middle">Pre-Auth / Anonymous Flow</text>
  <text class="s" x="471" y="440" font-size="10" text-anchor="middle">• get_anonymous_session()</text>
  <text class="s" x="471" y="456" font-size="10" text-anchor="middle">• app.tenant_id is deliberately unset</text>
  <text class="s" x="471" y="472" font-size="10" text-anchor="middle">• Ordinary RLS tables return zero rows</text>
  <text class="s" x="471" y="488" font-size="10" text-anchor="middle">• Uses login_lookup() SECURITY DEFINER</text>

  <rect class="n" x="624" y="402" width="265" height="100" rx="4"/>
  <text class="t" x="756" y="422" font-size="12" text-anchor="middle">Authorization &amp; Scoping Engine</text>
  <text class="s" x="756" y="440" font-size="10" text-anchor="middle">• Roles: SUPER_ADMIN, HR_MANAGER, etc.</text>
  <text class="s" x="756" y="456" font-size="10" text-anchor="middle">• 6 Scopes: ALL, LEGAL_ENTITY, ORG_UNIT</text>
  <text class="s" x="756" y="472" font-size="10" text-anchor="middle">• SELF, DIRECT_REPORTS, ALL_REPORTS</text>
  <text class="s" x="756" y="488" font-size="10" text-anchor="middle">• Compiles permissions into SQL predicates</text>

  <rect class="n" x="909" y="402" width="275" height="100" rx="4"/>
  <text class="t" x="1046" y="422" font-size="12" text-anchor="middle">Business Calendar &amp; DateTime Engine</text>
  <text class="s" x="1046" y="440" font-size="10" text-anchor="middle">• 7-day bitmask working days calculation</text>
  <text class="s" x="1046" y="456" font-size="10" text-anchor="middle">• Alternate Saturday pattern resolver</text>
  <text class="s" x="1046" y="472" font-size="10" text-anchor="middle">• Automated compute_day() metrics</text>
  <text class="s" x="1046" y="488" font-size="10" text-anchor="middle">• UUIDv7 and ULID sortable unique IDs</text>

  <!-- Connection from Backend to Database -->
  <polyline class="e" points="620,530 620,578" marker-end="url(#ah-containers)"/>
  <text class="s" x="630" y="556" font-size="12" text-anchor="start">asyncpg connection pool · Unprivileged role: hrms_app (Port 5432)</text>

  <!-- BOTTOM LAYER: POSTGRESQL DATABASE & STORAGE -->
  <rect class="g" x="20" y="580" width="1200" height="220" rx="8" stroke-width="1.25"/>
  <text class="t" x="34" y="604" font-size="14">Persistence &amp; Storage Tier · PostgreSQL 16 Alpine + Mounted Volumes</text>

  <!-- Dual Roles Box -->
  <rect class="n" x="40" y="620" width="370" height="160" rx="6" stroke-width="1.25"/>
  <text class="t" x="54" y="642" font-size="13">Dual-Role Security Model</text>
  <text class="s" x="54" y="662" font-size="11">1. Migration Superuser: hrms</text>
  <text class="s" x="70" y="678" font-size="10">Runs Alembic DDL migrations (0001–0016) · Full privileges</text>
  <text class="s" x="54" y="700" font-size="11">2. Runtime Application Role: hrms_app</text>
  <text class="s" x="70" y="716" font-size="10">Created in migration 0005 with NOSUPERUSER &amp; NOBYPASSRLS</text>
  <text class="s" x="70" y="732" font-size="10">Runs all application queries under set_config('app.tenant_id')</text>
  <text class="s" x="70" y="748" font-size="10">PostgreSQL engine itself denies query if tenant_id doesn't match</text>

  <!-- Row Level Security Box -->
  <rect class="na" x="430" y="620" width="450" height="160" rx="6" stroke-width="1.25"/>
  <text class="ta" x="444" y="642" font-size="13">Native Row-Level Security (RLS)</text>
  <text class="s" x="444" y="662" font-size="11">Enforced across all 25+ tenant-scoped tables:</text>
  <text class="s" x="458" y="678" font-size="10">• legal_entities, org_units, locations, jobs, grades, cost_centres</text>
  <text class="s" x="458" y="694" font-size="10">• persons, employments, assignments, employee_kyc_records/documents</text>
  <text class="s" x="458" y="710" font-size="10">• punches, attendance_days, holidays, leave_applications, balances</text>
  <text class="s" x="458" y="726" font-size="10">• attendance_correction_requests, policy_templates, onboarding_cases</text>
  <text class="s" x="444" y="750" font-size="11">RLS Policy: tenant_id = current_setting('app.tenant_id')::uuid</text>
  <text class="s" x="444" y="766" font-size="10">Keys: Composite primary key (tenant_id, id) prevents cross-tenant references</text>

  <!-- Storage Box -->
  <rect class="n" x="900" y="620" width="300" height="160" rx="6" stroke-width="1.25"/>
  <text class="t" x="914" y="642" font-size="13">Storage &amp; Persistence</text>
  <text class="s" x="914" y="666" font-size="11">• PostgreSQL Data Volume:</text>
  <text class="s" x="928" y="682" font-size="10">Named Docker volume postgres_data</text>
  <text class="s" x="914" y="706" font-size="11">• Document Storage:</text>
  <text class="s" x="928" y="722" font-size="10">Local directory: /app/storage/kyc</text>
  <text class="s" x="928" y="738" font-size="10">Secured uploads: PAN, Aadhaar, Cheques</text>
  <text class="s" x="914" y="762" font-size="11">• In-memory caching: LRU for policy trees</text>
</svg>