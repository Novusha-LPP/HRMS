<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="A personnel action is approved, applied on its effective date as an effective-dated write plus audit entry in one transaction, and published as an event that every other module consumes." font-family="'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5e67"/></marker></defs><rect x="0.5" y="0.5" width="999" height="439" rx="10" fill="#ffffff" stroke="#d5dde1"/><rect x="20" y="30" width="200" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="120.0" y="56.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Personnel action</text><text x="120.0" y="72.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">Transfer to Vadodara</text><text x="120.0" y="88.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">effective 01 Oct 2026</text><rect x="270" y="30" width="200" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="370.0" y="56.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Approval workflow</text><text x="370.0" y="72.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">line manager → HR</text><text x="370.0" y="88.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">reason required</text><rect x="520" y="30" width="200" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="620.0" y="56.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Scheduler</text><text x="620.0" y="72.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">applies it on</text><text x="620.0" y="88.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">01 Oct 2026</text><rect x="770" y="30" width="200" height="76" rx="6" fill="#ddeaea" stroke="#0d6b6b" stroke-width="1.25"/><text x="870.0" y="56.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">One transaction</text><text x="870.0" y="72.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">assignment slice + audit</text><text x="870.0" y="88.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">+ outbox record</text><polyline points="220,68 268,68" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="244.0" y="60" font-size="12" fill="#4f5e67" text-anchor="middle">submit</text><polyline points="470,68 518,68" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="494.0" y="60" font-size="12" fill="#4f5e67" text-anchor="middle">approve</text><polyline points="720,68 768,68" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="744.0" y="60" font-size="12" fill="#4f5e67" text-anchor="middle">on date</text><rect x="300" y="170" width="400" height="56" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="500.0" y="194.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Event bus (per cell)</text><text x="500.0" y="210.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">AssignmentChanged · tenant · employee · from → to · effective</text><polyline points="870,106 870,140 500,140 500,168" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="690" y="134" font-size="12" fill="#4f5e67" text-anchor="middle">publish</text><rect x="20" y="300" width="128" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="84.0" y="326.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Attendance</text><text x="84.0" y="342.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">new shift &amp; holiday</text><text x="84.0" y="358.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">calendar from 01 Oct</text><polyline points="500,226 500,262 84.0,262 84.0,298" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="158" y="300" width="128" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="222.0" y="326.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Leave</text><text x="222.0" y="342.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">location holidays</text><text x="222.0" y="358.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">in balance maths</text><polyline points="500,226 500,262 222.0,262 222.0,298" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="296" y="300" width="128" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="360.0" y="326.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Access</text><text x="360.0" y="342.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">recompute who</text><text x="360.0" y="358.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">can see her</text><polyline points="500,226 500,262 360.0,262 360.0,298" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="434" y="300" width="128" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="498.0" y="326.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Action Centre</text><text x="498.0" y="342.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">induction at</text><text x="498.0" y="358.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">the new site</text><polyline points="500,226 500,262 498.0,262 498.0,298" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="572" y="300" width="128" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="636.0" y="326.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Notifications</text><text x="636.0" y="342.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">employee, old and</text><text x="636.0" y="358.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">new manager</text><polyline points="500,226 500,262 636.0,262 636.0,298" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="710" y="300" width="128" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="774.0" y="326.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Search &amp; reads</text><text x="774.0" y="342.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">index, 360,</text><text x="774.0" y="358.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">dashboards</text><polyline points="500,226 500,262 774.0,262 774.0,298" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="848" y="300" width="128" height="76" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="912.0" y="326.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Webhooks</text><text x="912.0" y="342.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">directory,</text><text x="912.0" y="358.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">payroll, ERP</text><polyline points="500,226 500,262 912.0,262 912.0,298" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="20" y="410" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="start">Modules never read each other's tables; they react to events. A retro-dated action also triggers recalculation of the affected periods.</text></svg>