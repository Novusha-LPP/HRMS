ition (optional)</text><rect x="462" y="380" width="92" height="26" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="508.0" y="397.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Manager(s)</text><rect x="562" y="380" width="99" height="26" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="611.5" y="397.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Cost centre</text><rect x="669" y="380" width="85" height="26" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="711.5" y="397.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Pay group</text><rect x="762" y="380" width="141" height="26" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="832.5" y="397.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Custom dimensions</text></svg>