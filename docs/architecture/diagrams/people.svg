<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-label="One person has one or more employments with legal entities; each employment is a series of effective-dated assignment slices, including scheduled future slices; an inter-company transfer ends one employment and starts a linked one." font-family="'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5e67"/></marker></defs><rect x="0.5" y="0.5" width="1099" height="419" rx="10" fill="#ffffff" stroke="#d5dde1"/><text x="470" y="34" font-size="12" font-weight="600" fill="#16222a" text-anchor="start">Assignment slices on the valid-time axis  (effective_from → effective_to)</text><line x1="470" y1="44" x2="1080" y2="44" stroke="#d5dde1" stroke-width="1.25"/><rect x="20" y="160" width="170" height="100" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="105.0" y="190.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Person</text><text x="105.0" y="206.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">one per human, per tenant</text><text x="105.0" y="222.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">identity · contacts · family</text><text x="105.0" y="238.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">vault for PAN / UAN / bank</text><rect x="240" y="60" width="200" height="80" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="340.0" y="88.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Employment 1</text><text x="340.0" y="104.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">Kaveri Polymers</text><text x="340.0" y="120.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">KP-24-00212</text><rect x="240" y="240" width="200" height="80" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="340.0" y="268.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Employment 2</text><text x="340.0" y="284.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">Kaveri Logistics</text><text x="340.0" y="300.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">new or same ID: tenant rule</text><polyline points="190,195 215,195 215,100 238,100" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="206" y="150" font-size="12" fill="#4f5e67" text-anchor="end">has</text><polyline points="190,225 215,225 215,280 238,280" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="340,140 340,238" fill="none" stroke="#4f5e67" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="350" y="180" font-size="12" fill="#4f5e67" text-anchor="start">inter-company transfer:</text><text x="350" y="195" font-size="12" fill="#4f5e67" text-anchor="start">end one, start one, linked</text><rect x="470" y="70" width="170" height="60" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="555.0" y="96.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Feb 2024 → Mar 2026</text><text x="555.0" y="112.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">Pune · Executive</text><rect x="646" y="70" width="140" height="60" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="716.0" y="96.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Mar → Jun 2026</text><text x="716.0" y="112.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">new manager</text><rect x="792" y="250" width="140" height="60" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="862.0" y="276.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Jul → Sep 2026</text>