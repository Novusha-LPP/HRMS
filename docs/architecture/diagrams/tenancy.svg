<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="A request is resolved to one tenant at the edge, routed to that tenant's home cell, and carries the tenant context into every store; pooled and dedicated cells run the same code and schema." font-family="'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5e67"/></marker></defs><rect x="0.5" y="0.5" width="999" height="479" rx="10" fill="#ffffff" stroke="#d5dde1"/><rect x="20" y="205" width="130" height="70" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="85.0" y="236.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Web · Mobile · API</text><text x="85.0" y="252.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">kaveri.hrms.app</text><rect x="200" y="195" width="160" height="90" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="280.0" y="220.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Edge</text><text x="280.0" y="236.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">tenant from host</text><text x="280.0" y="252.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">+ token; reject if</text><text x="280.0" y="268.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">they differ</text><polyline points="150,240 198,240" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="200" y="30" width="360" height="86" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="380.0" y="61.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Control plane · global · no employee data</text><text x="380.0" y="77.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">tenant → home region → cell</text><text x="380.0" y="93.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">plan &amp; modules · packs · release ring</text><polyline points="280,195 280,118" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="288" y="160" font-size="12" fill="#4f5e67" text-anchor="start">lookup (cached)</text><rect x="410" y="150" width="570" height="200" rx="8" fill="none" stroke="#7b8a92" stroke-width="1.25" stroke-dasharray="6 5"/><text x="422" y="170" font-size="13" font-weight="600" fill="#16222a">Cell IN-1 · India region · pooled</text><text x="422" y="186" font-size="12" fill="#4f5e67">many tenants share one stack; tenant_id on every row</text><rect x="428" y="205" width="130" height="70" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="493.0" y="236.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">API / BFF</text><text x="493.0" y="252.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">sets tenant context</text><rect x="588" y="205" width="150" height="70" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="663.0" y="228.0" font-size="13" font-weight="600" fill="#16222a" text-anchor="middle">Modules &amp; workers</text><text x="663.0" y="244.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">context carried into</text><text x="663.0" y="260.0" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">every job and event</text><polyline points="558,240 586,240" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="770" y="190" width="196" height="32" rx="6" fill="#ddeaea" stroke="#0d6b6b" stroke-width="1.25"/><text x="868.0" y="210.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Postgres · RLS on tenant_id</text><polyline points="738,240 754,240 754,206 768,206" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="770" y="230" width="196" height="32" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="868.0" y="250.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Cache · keys t:{id}:…</text><polyline points="738,240 754,240 754,246 768,246" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="770" y="270" width="196" height="32" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="868.0" y="290.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Files · /t/{id}/ · tenant key</text><polyline points="738,240 754,240 754,286 768,286" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="770" y="310" width="196" height="32" rx="6" fill="#f4f6f7" stroke="#7b8a92" stroke-width="1.25"/><text x="868.0" y="330.0" font-size="12" font-weight="600" fill="#16222a" text-anchor="middle">Events · tenant_id in envelope</text><polyline points="738,240 754,240 754,326 768,326" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><rect x="410" y="378" width="570" height="84" rx="8" fill="none" stroke="#7b8a92" stroke-width="1.25" stroke-dasharray="6 5"/><text x="422" y="398" font-size="13" font-weight="600" fill="#16222a">Cell IN-2 · India region · dedicated</text><text x="422" y="414" font-size="12" fill="#4f5e67">one enterprise tenant: same code, same schema, own database and keys</text><text x="422" y="448" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="start">A tenant moves between cells by migrating its data, never by changing code.</text><polyline points="360,240 384,240 384,250 408,250" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><text x="280" y="306" font-size="12" font-weight="400" fill="#4f5e67" text-anchor="middle">routes to the home cell</text><polyline points="360,262 384,262 384,420 408,420" fill="none" stroke="#4f5e67" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="560,73 700,73 700,148" fill="none" stroke="#4f5e67" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="706" y="100" font-size="12" fill="#4f5e67" text-anchor="start">provision · config · releases</text></svg>