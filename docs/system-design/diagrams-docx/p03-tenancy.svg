<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Arial,'Liberation Sans',Helvetica,sans-serif"><style>.bg{fill:#ffffff}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:6 4}.np{fill:#eceff1;stroke:#7b8a92}.nt{fill:#ffffff;stroke:#9aa7ae;stroke-dasharray:4 4}.nw{fill:#fdf3dc;stroke:#b07a12}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:7 5}.gs{fill:#fafbfb;stroke:#b4c0c7}.t{fill:#16222a;font-weight:700}.s{fill:#4f5e67}.ta{fill:#0b5a5a;font-weight:700}.tt{fill:#5d6b73;font-weight:700}.e{fill:none;stroke:#4f5e67;stroke-width:1.6}.ed{fill:none;stroke:#4f5e67;stroke-width:1.6;stroke-dasharray:6 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.3;stroke-dasharray:4 4}.lf{fill:none;stroke:#9aa7ae;stroke-width:1.2}.num{fill:#0d6b6b;font-weight:700}</style><defs><marker id="ah-p03-tenancy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="520"/><rect class="np" x="20" y="200" width="140" height="70" rx="16" stroke-width="1.4"/><text class="t" x="90.0" y="230.5" font-size="15" text-anchor="middle">Client</text><text class="s" x="90.0" y="252.2" font-size="13" text-anchor="middle">web, app, API</text><rect class="n" x="190" y="190" width="170" height="90" rx="7" stroke-width="1.4"/><text class="t" x="275.0" y="212.5" font-size="15" text-anchor="middle">Gateway</text><text class="s" x="275.0" y="234.2" font-size="13" text-anchor="middle">tenant from token</text><text class="s" x="275.0" y="252.2" font-size="13" text-anchor="middle">(and host for web)</text><text class="s" x="275.0" y="270.2" font-size="13" text-anchor="middle">mismatch → reject</text><polyline class="e" points="160,235 188,235" marker-end="url(#ah-p03-tenancy)"/><rect class="n" x="190" y="30" width="330" height="80" rx="7" stroke-width="1.4"/><text class="t" x="355.0" y="56.5" font-size="15" text-anchor="middle">Control plane</text><text class="s" x="355.0" y="78.2" font-size="13" text-anchor="middle">tenant → region → cell</text><text class="s" x="355.0" y="96.2" font-size="13" text-anchor="middle">aggregates only, no employee data</text><polyline class="e" points="275,190 275,112" marker-end="url(#ah-p03-tenancy)"/><text class="s" x="283" y="156" font-size="13" text-anchor="start">lookup (cached)</text><rect class="g" x="400" y="150" width="460" height="226" rx="9" stroke-width="1.4"/><text class="t" x="414" y="172" font-size="14">Cell (pooled)</text><text class="s" x="414" y="190" font-size="13">tenant_id on every row</text><rect class="n" x="416" y="206" width="150" height="72" rx="7" stroke-width="1.4"/><text class="t" x="491.0" y="228.5" font-size="15" text-anchor="middle">App</text><text class="s" x="491.0" y="250.2" font-size="13" text-anchor="middle">tenant set per</text><text class="s" x="491.0" y="268.2" font-size="13" text-anchor="middle">transaction</text><polyline class="e" points="360,242 414,242" marker-end="url(#ah-p03-tenancy)"/><rect class="na" x="610" y="196" width="236" height="34" rx="7" stroke-width="1.4"/><text class="ta" x="728.0" y="216.9" font-size="13" text-anchor="middle">PostgreSQL: RLS, fails loudly</text><polyline class="e" points="566,242 588,242 588,213 608,213" marker-end="url(#ah-p03-tenancy)"/><rect class="n" x="610" y="240" width="236" height="34" rx="7" stroke-width="1.4"/><text class="t" x="728.0" y="260.9" font-size="13" text-anchor="middle">Cache keys: t:{tenant}:…</text><polyline class="e" points="566,242 588,242 588,257 608,257" marker-end="url(#ah-p03-tenancy)"/><rect class="n" x="610" y="284" width="236" height="34" rx="7" stroke-width="1.4"/><text class="t" x="728.0" y="304.9" font-size="13" text-anchor="middle">Files: /t/{tenant}/ + key</text><polyline class="e" points="566,242 588,242 588,301 608,301" marker-end="url(#ah-p03-tenancy)"/><rect class="n" x="610" y="328" width="236" height="34" rx="7" stroke-width="1.4"/><text class="t" x="728.0" y="348.9" font-size="13" text-anchor="middle">Events: tenant in envelope</text><polyline class="e" points="566,242 588,242 588,345 608,345" marker-end="url(#ah-p03-tenancy)"/><rect class="g" x="400" y="396" width="460" height="100" rx="9" stroke-width="1.4"/><text class="t" x="414" y="418" font-size="14">Dedicated database or cell</text><text class="s" x="414" y="436" font-size="13">same code, schema and migrations</text><text class="s" x="414" y="470" font-size="13" text-anchor="start">Moves between tiers by data migration (logical replication), never by code.</text><polyline class="e" points="360,262 380,262 380,446 398,446" marker-end="url(#ah-p03-tenancy)"/><polyline class="ed" points="520,70 640,70 640,148" marker-end="url(#ah-p03-tenancy)"/><text class="s" x="648" y="100" font-size="13" text-anchor="start">provision, route</text></svg>