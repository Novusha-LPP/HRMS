<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Arial,'Liberation Sans',Helvetica,sans-serif"><style>.bg{fill:#ffffff}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:6 4}.np{fill:#eceff1;stroke:#7b8a92}.nt{fill:#ffffff;stroke:#9aa7ae;stroke-dasharray:4 4}.nw{fill:#fdf3dc;stroke:#b07a12}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:7 5}.gs{fill:#fafbfb;stroke:#b4c0c7}.t{fill:#16222a;font-weight:700}.s{fill:#4f5e67}.ta{fill:#0b5a5a;font-weight:700}.tt{fill:#5d6b73;font-weight:700}.e{fill:none;stroke:#4f5e67;stroke-width:1.6}.ed{fill:none;stroke:#4f5e67;stroke-width:1.6;stroke-dasharray:6 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.3;stroke-dasharray:4 4}.lf{fill:none;stroke:#9aa7ae;stroke-width:1.2}.num{fill:#0d6b6b;font-weight:700}</style><defs><marker id="ah-p06-config" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="480"/><text class="t" x="20" y="26" font-size="13" text-anchor="start">Layer, general to specific</text><text class="t" x="360" y="26" font-size="13" text-anchor="start">Grace period</text><rect class="n" x="20" y="40" width="320" height="40" rx="7" stroke-width="1.4"/><text class="t" x="32" y="64.2" font-size="14" text-anchor="start">Platform default</text><rect class="n" x="360" y="40" width="110" height="40" rx="7" stroke-width="1.4"/><text class="t" x="415.0" y="64.2" font-size="14" text-anchor="middle">0 min</text><rect class="n" x="20" y="90" width="320" height="40" rx="7" stroke-width="1.4"/><text class="t" x="32" y="114.2" font-size="14" text-anchor="start">Country pack · India</text><rect class="n" x="360" y="90" width="110" height="40" rx="7" stroke-width="1.4"/><text class="t" x="415.0" y="114.2" font-size="14" text-anchor="middle">—</text><rect class="n" x="20" y="140" width="320" height="40" rx="7" stroke-width="1.4"/><text class="t" x="32" y="164.2" font-size="14" text-anchor="start">Industry pack · Manufacturing</text><rect class="n" x="360" y="140" width="110" height="40" rx="7" stroke-width="1.4"/><text class="t" x="415.0" y="164.2" font-size="14" text-anchor="middle">5 min</text><rect class="n" x="20" y="190" width="320" height="40" rx="7" stroke-width="1.4"/><text class="t" x="32" y="214.2" font-size="14" text-anchor="start">Tenant · Kaveri Group</text><rect class="na" x="360" y="190" width="110" height="40" rx="7" stroke-width="1.4"/><text class="ta" x="415.0" y="214.2" font-size="14" text-anchor="middle">10 min</text><rect class="n" x="20" y="240" width="320" height="40" rx="7" stroke-width="1.4"/><text class="t" x="32" y="264.2" font-size="14" text-anchor="start">Company · Kaveri Polymers</text><rect class="n" x="360" y="240" width="110" height="40" rx="7" stroke-width="1.4"/><text class="t" x="415.0" y="264.2" font-size="14" text-anchor="middle">—</text><rect class="n" x="20" y="290" width="320" height="40" rx="7" stroke-width="1.4"/><text class="t" x="32" y="314.2" font-size="14" text-anchor="start">Location · Vadodara Plant</text><rect class="na" x="360" y="290" width="110" height="40" rx="7" stroke-width="1.4"/><text class="ta" x="415.0" y="314.2" font-size="14" text-anchor="middle">5 min</text><rect class="n" x="20" y="340" width="320" height="40" rx="7" stroke-width="1.4"/><text class="t" x="32" y="364.2" font-size="14" text-anchor="start">Employee group · Shift workers</text><rect class="n" x="360" y="340" width="110" height="40" rx="7" stroke-width="1.4"/><text class="t" x="415.0" y="364.2" font-size="14" text-anchor="middle">—</text><rect class="n" x="560" y="140" width="300" height="70" rx="7" stroke-width="1.4"/><text class="t" x="710.0" y="170.5" font-size="15" text-anchor="middle">Priya · Pune office</text><text class="s" x="710.0" y="192.2" font-size="13" text-anchor="middle">gets 10 min (tenant)</text><rect class="n" x="560" y="290" width="300" height="70" rx="7" stroke-width="1.4"/><text class="t" x="710.0" y="320.5" font-size="15" text-anchor="middle">Imran · Vadodara shift worker</text><text class="s" x="710.0" y="342.2" font-size="13" text-anchor="middle">gets 5 min (location)</text><polyline class="e" points="470,210 520,210 520,175 558,175" marker-end="url(#ah-p06-config)"/><polyline class="e" points="470,310 520,310 520,325 558,325" marker-end="url(#ah-p06-config)"/><text class="s" x="20" y="420" font-size="13" text-anchor="start">The most specific published value wins; the effective date picks the version;</text><text class="s" x="20" y="440" font-size="13" text-anchor="start">a higher layer can lock a value (for example a statutory minimum). "Explain value" shows this chain to HR.</text></svg>