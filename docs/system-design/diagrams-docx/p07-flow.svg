xt class="s" x="547.5" y="351.7" font-size="13" text-anchor="middle">recompute visibility</text><rect class="n" x="665" y="300" width="195" height="70" rx="7" stroke-width="1.4"/><text class="t" x="762.5" y="330.2" font-size="14" text-anchor="middle">Action Centre</text><text class="s" x="762.5" y="351.7" font-size="13" text-anchor="middle">induction at new site</text><rect class="n" x="127" y="410" width="195" height="70" rx="7" stroke-width="1.4"/><text class="t" x="224.5" y="440.2" font-size="14" text-anchor="middle">Notifications</text><text class="s" x="224.5" y="461.7" font-size="13" text-anchor="middle">employee, managers</text><rect class="n" x="342" y="410" width="195" height="70" rx="7" stroke-width="1.4"/><text class="t" x="439.5" y="440.2" font-size="14" text-anchor="middle">Search, 360</text><text class="s" x="439.5" y="461.7" font-size="13" text-anchor="middle">reindex, refresh</text><rect class="n" x="557" y="410" width="195" height="70" rx="7" stroke-width="1.4"/><text class="t" x="654.5" y="440.2" font-size="14" text-anchor="middle">Webhooks</text><text class="s" x="654.5" y="461.7" font-size="13" text-anchor="middle">directory, payroll, ERP</text><polyline class="e" points="440,230 440,268 117,268 117,298" marker-end="url(#ah-p07-flow)"/><polyline class="e" points="332,268 332,298" marker-end="url(#ah-p07-flow)"/><polyline class="e" points="547,268 547,298" marker-end="url(#ah-p07-flow)"/><polyline class="e" points="762,268 762,298" marker-end="url(#ah-p07-flow)"/><line class="e" x1="117" y1="268" x2="762" y2="268"/><polyline class="e" points="440,268 440,390 224,390 224,408" marker-end="url(#ah-p07-flow)"/><polyline class="e" points="440,390 440,408" marker-end="url(#ah-p07-flow)"/><polyline class="e" points="440,390 654,390 654,408" marker-end="url(#ah-p07-flow)"/><text class="s" x="20" y="540" font-size="13" text-anchor="start">Modules never read each other's tables. A backdated action also recalculates the affected periods.</text></svg>