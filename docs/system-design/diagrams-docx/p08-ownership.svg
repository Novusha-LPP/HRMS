text-anchor="middle">per tenant, per field group</text><text class="s" x="415.0" y="162.2" font-size="13" text-anchor="middle">HRMS-owned · external ·</text><text class="s" x="415.0" y="180.2" font-size="13" text-anchor="middle">shared (with conflict rule)</text><polyline class="e" points="250,80 270,80 270,130 288,130" marker-end="url(#ah-p08-ownership)"/><text class="s" x="135" y="146" font-size="13" text-anchor="middle">bulk actions via API</text><polyline class="e" points="250,210 270,210 270,165 288,165" marker-end="url(#ah-p08-ownership)"/><rect class="n" x="590" y="20" width="270" height="86" rx="7" stroke-width="1.4"/><text class="t" x="725.0" y="49.2" font-size="14" text-anchor="middle">External-owned fields</text><text class="s" x="725.0" y="70.7" font-size="13" text-anchor="middle">applied directly, audited as an</text><text class="s" x="725.0" y="88.7" font-size="13" text-anchor="middle">integration change, read-only in UI</text><polyline class="e" points="540,145 565,145 565,63 588,63" marker-end="url(#ah-p08-ownership)"/><rect class="n" x="590" y="130" width="270" height="86" rx="7" stroke-width="1.4"/><text class="t" x="725.0" y="159.2" font-size="14" text-anchor="middle">HRMS-owned fields</text><text class="s" x="725.0" y="180.7" font-size="13" text-anchor="middle">personnel action with approvals</text><text class="s" x="725.0" y="198.7" font-size="13" text-anchor="middle">and effective date</text><polyline class="e" points="540,145 565,145 565,173 588,173" marker-end="url(#ah-p08-ownership)"/><rect class="n" x="590" y="240" width="270" height="86" rx="7" stroke-width="1.4"/><text class="t" x="725.0" y="269.2" font-size="14" text-anchor="middle">Shared fields</text><text class="s" x="725.0" y="290.7" font-size="13" text-anchor="middle">last writer by rule, or a</text><text class="s" x="725.0" y="308.7" font-size="13" text-anchor="middle">review queue for HR</text><polyline class="e" points="540,145 565,145 565,283 588,283" marker-end="url(#ah-p08-ownership)"/><text class="s" x="20" y="400" font-size="13" text-anchor="start">Tenants whose employee master lives elsewhere can still use Time, Leave, Compliance and the API without</text><text class="s" x="20" y="420" font-size="13" text-anchor="start">thousands of approval workflows per sync.</text></svg>