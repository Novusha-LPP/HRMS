<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Arial,'Liberation Sans',Helvetica,sans-serif"><style>.bg{fill:#ffffff}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:6 4}.np{fill:#eceff1;stroke:#7b8a92}.nt{fill:#ffffff;stroke:#9aa7ae;stroke-dasharray:4 4}.nw{fill:#fdf3dc;stroke:#b07a12}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:7 5}.gs{fill:#fafbfb;stroke:#b4c0c7}.t{fill:#16222a;font-weight:700}.s{fill:#4f5e67}.ta{fill:#0b5a5a;font-weight:700}.tt{fill:#5d6b73;font-weight:700}.e{fill:none;stroke:#4f5e67;stroke-width:1.6}.ed{fill:none;stroke:#4f5e67;stroke-width:1.6;stroke-dasharray:6 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.3;stroke-dasharray:4 4}.lf{fill:none;stroke:#9aa7ae;stroke-width:1.2}.num{fill:#0d6b6b;font-weight:700}</style><defs><marker id="ah-p09-attendance" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="500"/><rect class="np" x="20" y="20" width="220" height="72" rx="16" stroke-width="1.4"/><text class="t" x="130.0" y="51.2" font-size="14" text-anchor="middle">Direct-push devices</text><text class="s" x="130.0" y="72.7" font-size="13" text-anchor="middle">plain HTTP firmware</text><rect class="n" x="270" y="20" width="250" height="72" rx="7" stroke-width="1.4"/><text class="t" x="395.0" y="42.2" font-size="14" text-anchor="middle">Device edge</text><text class="s" x="395.0" y="63.7" font-size="13" text-anchor="middle">serial allowlist, per-device</text><text class="s" x="395.0" y="81.7" font-size="13" text-anchor="middle">secret, IP limits, validation</text><polyline class="e" points="240,56 268,56" marker-end="url(#ah-p09-attendance)"/><polyline class="e" points="520,56 560,56 560,146 588,146" marker-end="url(#ah-p09-attendance)"/><rect class="np" x="20" y="120" width="220" height="72" rx="16" stroke-width="1.4"/><text class="t" x="130.0" y="151.2" font-size="14" text-anchor="middle">LAN devices</text><text class="s" x="130.0" y="172.7" font-size="13" text-anchor="middle">behind a site network</text><rect class="n" x="270" y="120" width="250" height="72" rx="7" stroke-width="1.4"/><text class="t" x="395.0" y="142.2" font-size="14" text-anchor="middle">Site agent (Go)</text><text class="s" x="395.0" y="163.7" font-size="13" text-anchor="middle">signed, auto-updated,</text><text class="s" x="395.0" y="181.7" font-size="13" text-anchor="middle">mTLS, buffers offline</text><polyline class="e" points="240,156 268,156" marker-end="url(#ah-p09-attendance)"/><polyline class="e" points="520,156 560,156 560,146 588,146" marker-end="url(#ah-p09-attendance)"/><rect class="np" x="20" y="220" width="220" height="72" rx="16" stroke-width="1.4"/><text class="t" x="130.0" y="251.2" font-size="14" text-anchor="middle">Employee app</text><text class="s" x="130.0" y="272.7" font-size="13" text-anchor="middle">geo-fence, selfie, attestation</text><rect class="n" x="270" y="220" width="250" height="72" rx="7" stroke-width="1.4"/><text class="t" x="395.0" y="242.2" font-size="14" text-anchor="middle">Public API</text><text class="s" x="395.0" y="263.7" font-size="13" text-anchor="middle">POST /v1/punches:batch</text><text class="s" x="395.0" y="281.7" font-size="13" text-anchor="middle">Idempotency-Key</text><polyline class="e" points="240,256 268,256" marker-end="url(#ah-p09-attendance)"/><polyline class="e" points="520,256 560,256 560,146 588,146" marker-end="url(#ah-p09-attendance)"/><rect class="na" x="590" y="100" width="270" height="92" rx="7" stroke-width="1.4"/><text class="ta" x="725.0" y="132.5" font-size="15" text-anchor="middle">Ingestion service</text><text class="s" x="725.0" y="154.2" font-size="13" text-anchor="middle">idempotency key =</text><text class="s" x="725.0" y="172.2" font-size="13" text-anchor="middle">device + badge + time</text><rect class="n" x="20" y="340" width="195" height="86" rx="7" stroke-width="1.4"/><text class="t" x="117.5" y="378.2" font-size="14" text-anchor="middle">Raw punches</text><text class="s" x="117.5" y="399.7" font-size="13" text-anchor="middle">append-only, monthly</text><rect class="n" x="235" y="340" width="195" height="86" rx="7" stroke-width="1.4"/><text class="t" x="332.5" y="369.2" font-size="14" text-anchor="middle">Attendance days</text><text class="s" x="332.5" y="390.7" font-size="13" text-anchor="middle">roster, policy, leave,</text><text class="s" x="332.5" y="408.7" font-size="13" text-anchor="middle">holidays, corrections</text><polyline class="e" points="215,383 233,383" marker-end="url(#ah-p09-attendance)"/><rect class="n" x="450" y="340" width="195" height="86" rx="7" stroke-width="1.4"/><text class="t" x="547.5" y="369.2" font-size="14" text-anchor="middle">Period close</text><text class="s" x="547.5" y="390.7" font-size="13" text-anchor="middle">per company or</text><text class="s" x="547.5" y="408.7" font-size="13" text-anchor="middle">pay group</text><polyline class="e" points="430,383 448,383" marker-end="url(#ah-p09-attendance)"/><rect class="na" x="665" y="340" width="195" height="86" rx="7" stroke-width="1.4"/><text class="ta" x="762.5" y="369.2" font-size="14" text-anchor="middle">Payroll inputs</text><text class="s" x="762.5" y="390.7" font-size="13" text-anchor="middle">versioned snapshot,</text><text class="s" x="762.5" y="408.7" font-size="13" text-anchor="middle">deltas after close</text><polyline class="e" points="645,383 663,383" marker-end="url(#ah-p09-attendance)"/><polyline class="e" points="725,192 725,300 117,300 117,338" marker-end="url(#ah-p09-attendance)"/><text class="s" x="20" y="470" font-size="13" text-anchor="start">Punches are never edited. Days are computed and can always be recomputed; corrections are overlays.</text></svg>