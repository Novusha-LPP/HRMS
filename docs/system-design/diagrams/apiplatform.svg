<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-label="API platform: developers register apps in the developer portal, get OAuth clients from identity, and call the API through the Kong gateway, which validates tokens, enforces plan quotas and routes to the home cell; cells publish events that the webhook dispatcher delivers to customer endpoints; gateway logs feed metering and billing; sandbox tokens route to a sandbox cell." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-apiplatform" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1239" height="639" rx="10"/><rect class="np" x="20" y="150" width="240" height="60" rx="14" stroke-width="1.25"/><text class="t" x="140.0" y="184.5" font-size="12" text-anchor="middle">Customer IT integrations</text><rect class="np" x="20" y="230" width="240" height="60" rx="14" stroke-width="1.25"/><text class="t" x="140.0" y="264.5" font-size="12" text-anchor="middle">ISV and partner apps</text><rect class="np" x="20" y="310" width="240" height="60" rx="14" stroke-width="1.25"/><text class="t" x="140.0" y="336.5" font-size="12" text-anchor="middle">iPaaS</text><text class="s" x="140.0" y="352.5" font-size="12" text-anchor="middle">MuleSoft · Boomi · Workato · Zapier</text><rect class="np" x="20" y="390" width="240" height="60" rx="14" stroke-width="1.25"/><text class="t" x="140.0" y="424.5" font-size="12" text-anchor="middle">Our web and mobile apps</text><rect class="n" x="300" y="20" width="430" height="80" rx="6" stroke-width="1.25"/><text class="t" x="515.0" y="48.5" font-size="13" text-anchor="middle">Developer portal</text><text class="s" x="515.0" y="64.5" font-size="12" text-anchor="middle">docs · sandbox signup · app registration · OAuth clients</text><text class="s" x="515.0" y="80.5" font-size="12" text-anchor="middle">usage charts · webhook endpoints · changelog</text><rect class="n" x="770" y="20" width="210" height="80" rx="6" stroke-width="1.25"/><text class="t" x="875.0" y="56.5" font-size="13" text-anchor="middle">Control plane</text><text class="s" x="875.0" y="72.5" font-size="12" text-anchor="middle">app registry, plans, quotas</text><rect class="n" x="1010" y="20" width="210" height="80" rx="6" stroke-width="1.25"/><text class="t" x="1115.0" y="56.5" font-size="13" text-anchor="middle">Identity (Keycloak)</text><text class="s" x="1115.0" y="72.5" font-size="12" text-anchor="middle">OAuth clients per tenant</text><polyline class="e" points="140,148 140,60 298,60" marker-end="url(#ah-apiplatform)"/><text class="s" x="146" y="120" font-size="12" text-anchor="start">register app</text><polyline class="e" points="730,60 768,60" marker-end="url(#ah-apiplatform)"/><polyline class="e" points="980,60 1008,60" marker-end="url(#ah-apiplatform)"/><rect class="na" x="300" y="190" width="430" height="150" rx="6" stroke-width="1.25"/><text class="ta" x="515.0" y="237.5" font-size="15" text-anchor="middle">API gateway (Kong)</text><text class="s" x="515.0" y="253.5" font-size="12" text-anchor="middle">validate JWT (JWKS) and tenant claim</text><text class="s" x="515.0" y="269.5" font-size="12" text-anchor="middle">plan quotas and rate limits per tenant and app</text><text class="s" x="515.0" y="285.5" font-size="12" text-anchor="middle">OpenAPI request validation · IP allowlist · mTLS</text><text class="s" x="515.0" y="301.5" font-size="12" text-anchor="middle">route to home cell · write access logs</text><polyline class="e" points="262,265 298,265" marker-end="url(#ah-apiplatform)"/><polyline class="e" points="1115,102 1115,130 760,130 760,210 732,210" marker-end="url(#ah-apiplatform)"/><text class="s" x="940" y="124" font-size="12" text-anchor="middle">JWKS keys</text><rect class="n" x="780" y="220" width="200" height="90" rx="6" stroke-width="1.25"/><text class="t" x="880.0" y="253.5" font-size="13" text-anchor="middle">Cell: Public API v1</text><text class="s" x="880.0" y="269.5" font-size="12" text-anchor="middle">scoped queries, RLS</text><text class="s" x="880.0" y="285.5" font-size="12" text-anchor="middle">thin events to outbox</text><polyline class="e" points="730,265 778,265" marker-end="url(#ah-apiplatform)"/><text class="s" x="754" y="258" font-size="12" text-anchor="middle">route</text><rect class="n" x="1010" y="220" width="210" height="60" rx="6" stroke-width="1.25"/><text class="t" x="1115.0" y="246.5" font-size="13" text-anchor="middle">Outbox → Kafka</text><text class="s" x="1115.0" y="262.5" font-size="12" text-anchor="middle">CloudEvents envelope</text><rect class="na" x="1010" y="310" width="210" height="80" rx="6" stroke-width="1.25"/><text class="ta" x="1115.0" y="346.5" font-size="13" text-anchor="middle">Webhook dispatcher (Svix)</text><text class="s" x="1115.0" y="362.5" font-size="12" text-anchor="middle">sign · retry · DLQ · replay</text><polyline class="e" points="980,250 1008,250" marker-end="url(#ah-apiplatform)"/><polyline class="e" points="1115,280 1115,308" marker-end="url(#ah-apiplatform)"/><polyline class="e" points="1220,350 1230,350 1230,600 140,600 140,452" marker-end="url(#ah-apiplatform)"/><text class="s" x="620" y="592" font-size="12" text-anchor="middle">signed webhooks to customer endpoints (static egress IPs)</text><rect class="n" x="300" y="440" width="200" height="70" rx="6" stroke-width="1.25"/><text class="t" x="400.0" y="471.5" font-size="13" text-anchor="middle">Usage events</text><text class="s" x="400.0" y="487.5" font-size="12" text-anchor="middle">gateway logs → Kafka</text><rect class="n" x="530" y="440" width="200" height="70" rx="6" stroke-width="1.25"/><text class="t" x="630.0" y="471.5" font-size="13" text-anchor="middle">Usage aggregation</text><text class="s" x="630.0" y="487.5" font-size="12" text-anchor="middle">ClickHouse, per tenant, app</text><rect class="n" x="760" y="440" width="220" height="70" rx="6" stroke-width="1.25"/><text class="t" x="870.0" y="463.5" font-size="13" text-anchor="middle">Billing</text><text class="s" x="870.0" y="479.5" font-size="12" text-anchor="middle">Chargebee + Razorpay</text><text class="s" x="870.0" y="495.5" font-size="12" text-anchor="middle">GST invoices</text><rect class="n" x="1010" y="440" width="210" height="70" rx="6" stroke-width="1.25"/><text class="t" x="1115.0" y="471.5" font-size="13" text-anchor="middle">Sandbox cell</text><text class="s" x="1115.0" y="487.5" font-size="12" text-anchor="middle">synthetic data, nightly reset</text><polyline class="e" points="400,342 400,438" marker-end="url(#ah-apiplatform)"/><text class="s" x="408" y="400" font-size="12" text-anchor="start">log</text><polyline class="e" points="500,475 528,475" marker-end="url(#ah-apiplatform)"/><polyline class="e" points="730,475 758,475" marker-end="url(#ah-apiplatform)"/><polyline class="e" points="720,342 720,420 1060,420 1060,438" marker-end="url(#ah-apiplatform)"/><text class="s" x="890" y="414" font-size="12" text-anchor="middle">sandbox tokens</text></svg>