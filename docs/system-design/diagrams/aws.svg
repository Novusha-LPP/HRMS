<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-label="AWS deployment: a global tier with Route 53, CloudFront and the control plane; a primary region in Mumbai with a regional edge account and cell accounts spread across three availability zones; a disaster-recovery region in Hyderabad fed by Aurora Global Database and S3 replication." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-aws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1239" height="799" rx="10"/><rect class="g" x="20" y="20" width="1200" height="96" rx="8" stroke-width="1.25"/><text class="t" x="32" y="40" font-size="13">Global</text><rect class="n" x="40" y="50" width="240" height="52" rx="6" stroke-width="1.25"/><text class="t" x="160.0" y="72.5" font-size="13" text-anchor="middle">Route 53</text><text class="s" x="160.0" y="88.5" font-size="12" text-anchor="middle">latency and failover routing</text><rect class="n" x="300" y="50" width="300" height="52" rx="6" stroke-width="1.25"/><text class="t" x="450.0" y="72.5" font-size="13" text-anchor="middle">CloudFront + WAF + Shield Advanced</text><text class="s" x="450.0" y="88.5" font-size="12" text-anchor="middle">static assets, edge protection</text><rect class="na" x="620" y="50" width="300" height="52" rx="6" stroke-width="1.25"/><text class="ta" x="770.0" y="72.5" font-size="13" text-anchor="middle">Control plane account</text><text class="s" x="770.0" y="88.5" font-size="12" text-anchor="middle">Aurora (CP) · DynamoDB global table</text><rect class="n" x="940" y="50" width="260" height="52" rx="6" stroke-width="1.25"/><text class="t" x="1070.0" y="72.5" font-size="13" text-anchor="middle">Organizations · Control Tower</text><text class="s" x="1070.0" y="88.5" font-size="12" text-anchor="middle">SCPs, log archive, security</text><rect class="g" x="20" y="136" width="800" height="644" rx="8" stroke-width="1.25"/><text class="t" x="32" y="156" font-size="13">ap-south-1 · Mumbai (primary)</text><rect class="na" x="40" y="176" width="370" height="64" rx="6" stroke-width="1.25"/><text class="ta" x="225.0" y="204.5" font-size="13" text-anchor="middle">Regional edge account</text><text class="s" x="225.0" y="220.5" font-size="12" text-anchor="middle">NLB → Kong on EKS · Keycloak on EKS + Aurora</text><rect class="n" x="430" y="176" width="370" height="64" rx="6" stroke-width="1.25"/><text class="t" x="615.0" y="204.5" font-size="13" text-anchor="middle">Analytics and observability accounts</text><text class="s" x="615.0" y="220.5" font-size="12" text-anchor="middle">ClickHouse · Cube · Grafana stack</text><rect class="g" x="40" y="262" width="760" height="500" rx="8" stroke-width="1.25"/><text class="t" x="52" y="282" font-size="13">Cell account (one per cell) · VPC across three availability zones</text><text class="t" x="330" y="302" font-size="12" text-anchor="middle">AZ a</text><text class="t" x="515" y="302" font-size="12" text-anchor="middle">AZ b</text><text class="t" x="700" y="302" font-size="12" text-anchor="middle">AZ c</text><text class="t" x="60" y="344" font-size="13" text-anchor="start">EKS nodes</text><text class="s" x="60" y="360" font-size="12" text-anchor="start">app, workers, ingestion</text><rect class="n" x="250" y="322" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="332.5" y="348.5" font-size="12" text-anchor="middle">node group</text><rect class="n" x="435" y="322" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="517.5" y="348.5" font-size="12" text-anchor="middle">node group</text><rect class="n" x="620" y="322" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="702.5" y="348.5" font-size="12" text-anchor="middle">node group</text><text class="t" x="60" y="406" font-size="13" text-anchor="start">Aurora PostgreSQL</text><text class="s" x="60" y="422" font-size="12" text-anchor="start">writer (a), readers (b, c)</text><rect class="na" x="250" y="384" width="165" height="44" rx="6" stroke-width="1.25"/><text class="ta" x="332.5" y="410.5" font-size="12" text-anchor="middle">writer</text><rect class="n" x="435" y="384" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="517.5" y="410.5" font-size="12" text-anchor="middle">reader</text><rect class="n" x="620" y="384" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="702.5" y="410.5" font-size="12" text-anchor="middle">reader</text><text class="t" x="60" y="468" font-size="13" text-anchor="start">ElastiCache</text><text class="s" x="60" y="484" font-size="12" text-anchor="start">primary + replicas</text><rect class="n" x="250" y="446" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="332.5" y="472.5" font-size="12" text-anchor="middle">primary</text><rect class="n" x="435" y="446" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="517.5" y="472.5" font-size="12" text-anchor="middle">replica</text><rect class="n" x="620" y="446" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="702.5" y="472.5" font-size="12" text-anchor="middle">replica</text><text class="t" x="60" y="530" font-size="13" text-anchor="start">OpenSearch</text><text class="s" x="60" y="546" font-size="12" text-anchor="start">data nodes</text><rect class="n" x="250" y="508" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="332.5" y="534.5" font-size="12" text-anchor="middle">data node</text><rect class="n" x="435" y="508" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="517.5" y="534.5" font-size="12" text-anchor="middle">data node</text><rect class="n" x="620" y="508" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="702.5" y="534.5" font-size="12" text-anchor="middle">data node</text><text class="t" x="60" y="592" font-size="13" text-anchor="start">MSK</text><text class="s" x="60" y="608" font-size="12" text-anchor="start">one broker per AZ</text><rect class="n" x="250" y="570" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="332.5" y="596.5" font-size="12" text-anchor="middle">broker</text><rect class="n" x="435" y="570" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="517.5" y="596.5" font-size="12" text-anchor="middle">broker</text><rect class="n" x="620" y="570" width="165" height="44" rx="6" stroke-width="1.25"/><text class="t" x="702.5" y="596.5" font-size="12" text-anchor="middle">broker</text><rect class="n" x="60" y="640" width="720" height="52" rx="6" stroke-width="1.25"/><text class="t" x="420.0" y="662.5" font-size="12" text-anchor="middle">Regional services: S3 (per-cell bucket, Object Lock archive) · KMS · Secrets Manager</text><text class="s" x="420.0" y="678.5" font-size="12" text-anchor="middle">VPC endpoints · NAT with static egress IPs for webhooks · GuardDuty · PrivateLink endpoint service</text><rect class="n" x="60" y="702" width="720" height="44" rx="6" stroke-width="1.25"/><text class="t" x="420.0" y="728.5" font-size="12" text-anchor="middle">Private subnets for app and data; only the load balancers are public</text><rect class="g" x="840" y="136" width="380" height="644" rx="8" stroke-width="1.25"/><text class="t" x="852" y="156" font-size="13">ap-south-2 · Hyderabad (DR)</text><rect class="n" x="860" y="176" width="340" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1030.0" y="204.5" font-size="13" text-anchor="middle">Aurora Global Database secondary</text><text class="s" x="1030.0" y="220.5" font-size="12" text-anchor="middle">read-only, promotable in minutes</text><rect class="n" x="860" y="262" width="340" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1030.0" y="290.5" font-size="13" text-anchor="middle">S3 cross-region replication</text><text class="s" x="1030.0" y="306.5" font-size="12" text-anchor="middle">documents, exports, archive</text><rect class="n" x="860" y="348" width="340" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1030.0" y="376.5" font-size="13" text-anchor="middle">EKS standby (pilot light)</text><text class="s" x="1030.0" y="392.5" font-size="12" text-anchor="middle">images replicated in ECR</text><rect class="n" x="860" y="434" width="340" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1030.0" y="462.5" font-size="13" text-anchor="middle">Kong + Keycloak standby</text><text class="s" x="1030.0" y="478.5" font-size="12" text-anchor="middle">config from Git, Aurora secondary</text><rect class="n" x="860" y="520" width="340" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1030.0" y="548.5" font-size="13" text-anchor="middle">MSK standby</text><text class="s" x="1030.0" y="564.5" font-size="12" text-anchor="middle">critical topics mirrored</text><rect class="n" x="860" y="606" width="340" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1030.0" y="634.5" font-size="13" text-anchor="middle">Route 53 failover records</text><text class="s" x="1030.0" y="650.5" font-size="12" text-anchor="middle">health-checked</text><polyline class="e" points="780,390 858,208" marker-end="url(#ah-aws)"/><text class="s" x="870" y="256" font-size="12" text-anchor="start">Aurora Global Database replication, about 1 s lag</text><polyline class="e" points="780,666 858,294" marker-end="url(#ah-aws)"/></svg>