<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Configuration resolves from the most general layer to the most specific; the most specific layer that sets a value wins, so two employees of the same tenant can get different values." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-config" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="999" height="439" rx="10"/><text class="t" x="20" y="30" font-size="12" text-anchor="start">Layer (general → specific)</text><text class="t" x="420" y="30" font-size="12" text-anchor="start">Grace period set here</text><rect class="n" x="20" y="44" width="370" height="36" rx="6" stroke-width="1.25"/><text class="t" x="32" y="66.5" font-size="12" text-anchor="start">Platform default</text><rect class="n" x="420" y="44" width="120" height="36" rx="6" stroke-width="1.25"/><text class="t" x="480.0" y="66.5" font-size="12" text-anchor="middle">0 min</text><rect class="n" x="20" y="90" width="370" height="36" rx="6" stroke-width="1.25"/><text class="t" x="32" y="112.5" font-size="12" text-anchor="start">Country pack · India</text><rect class="n" x="420" y="90" width="120" height="36" rx="6" stroke-width="1.25"/><text class="t" x="480.0" y="112.5" font-size="12" text-anchor="middle">—</text><rect class="n" x="20" y="136" width="370" height="36" rx="6" stroke-width="1.25"/><text class="t" x="32" y="158.5" font-size="12" text-anchor="start">Industry pack · Manufacturing</text><rect class="n" x="420" y="136" width="120" height="36" rx="6" stroke-width="1.25"/><text class="t" x="480.0" y="158.5" font-size="12" text-anchor="middle">5 min</text><rect class="n" x="20" y="182" width="370" height="36" rx="6" stroke-width="1.25"/><text class="t" x="32" y="204.5" font-size="12" text-anchor="start">Tenant · Kaveri Group</text><rect class="na" x="420" y="182" width="120" height="36" rx="6" stroke-width="1.25"/><text class="ta" x="480.0" y="204.5" font-size="12" text-anchor="middle">10 min</text><rect class="n" x="20" y="228" width="370" height="36" rx="6" stroke-width="1.25"/><text class="t" x="32" y="250.5" font-size="12" text-anchor="start">Company · Kaveri Polymers</text><rect class="n" x="420" y="228" width="120" height="36" rx="6" stroke-width="1.25"/><text class="t" x="480.0" y="250.5" font-size="12" text-anchor="middle">—</text><rect class="n" x="20" y="274" width="370" height="36" rx="6" stroke-width="1.25"/><text class="t" x="32" y="296.5" font-size="12" text-anchor="start">Location · Vadodara Plant</text><rect class="na" x="420" y="274" width="120" height="36" rx="6" stroke-width="1.25"/><text class="ta" x="480.0" y="296.5" font-size="12" text-anchor="middle">5 min</text><rect class="n" x="20" y="320" width="370" height="36" rx="6" stroke-width="1.25"/><text class="t" x="32" y="342.5" font-size="12" text-anchor="start">Employee group · Shift workers</text><rect class="n" x="420" y="320" width="120" height="36" rx="6" stroke-width="1.25"/><text class="t" x="480.0" y="342.5" font-size="12" text-anchor="middle">—</text><text class="s" x="20" y="420" font-size="12" text-anchor="start">Most specific published value wins · the effective date picks the version · a layer can lock a value (e.g. a statutory minimum) so lower layers cannot override it</text><rect class="n" x="680" y="120" width="300" height="64" rx="6" stroke-width="1.25"/><text class="t" x="830.0" y="148.5" font-size="13" text-anchor="middle">Priya · Pune office · Sales</text><text class="s" x="830.0" y="164.5" font-size="12" text-anchor="middle">resolves to 10 min (Tenant)</text><rect class="n" x="680" y="250" width="300" height="64" rx="6" stroke-width="1.25"/><text class="t" x="830.0" y="278.5" font-size="13" text-anchor="middle">Imran · Vadodara Plant · shift worker</text><text class="s" x="830.0" y="294.5" font-size="12" text-anchor="middle">resolves to 5 min (Location)</text><polyline class="e" points="540,200 610,200 610,152 678,152" marker-end="url(#ah-config)"/><text class="s" x="616" y="168" font-size="12" text-anchor="start">wins for</text><polyline class="e" points="540,292 610,292 610,282 678,282" marker-end="url(#ah-config)"/><text class="s" x="616" y="276" font-size="12" text-anchor="start">wins for</text></svg>