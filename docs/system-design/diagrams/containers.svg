<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 880" width="1240" height="880" role="img" aria-label="Container view: clients reach a global edge and control plane that hold no employee data, then a regional API gateway and identity service, then one of several cells, each with the core modular monolith, satellite services and its own data stores; analytics is fed by change data capture." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-containers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1239" height="879" rx="10"/><rect class="np" x="20" y="20" width="190" height="48" rx="14" stroke-width="1.25"/><text class="t" x="115.0" y="48.5" font-size="12" text-anchor="middle">HR console (web SPA)</text><rect class="np" x="222" y="20" width="190" height="48" rx="14" stroke-width="1.25"/><text class="t" x="317.0" y="48.5" font-size="12" text-anchor="middle">Employee app (mobile)</text><rect class="np" x="424" y="20" width="190" height="48" rx="14" stroke-width="1.25"/><text class="t" x="519.0" y="48.5" font-size="12" text-anchor="middle">Admin console</text><rect class="np" x="626" y="20" width="190" height="48" rx="14" stroke-width="1.25"/><text class="t" x="721.0" y="48.5" font-size="12" text-anchor="middle">Developer portal</text><rect class="np" x="828" y="20" width="190" height="48" rx="14" stroke-width="1.25"/><text class="t" x="923.0" y="48.5" font-size="12" text-anchor="middle">Customer systems and ISVs</text><rect class="np" x="1030" y="20" width="190" height="48" rx="14" stroke-width="1.25"/><text class="t" x="1125.0" y="48.5" font-size="12" text-anchor="middle">Site agents and devices</text><polyline class="e" points="620,68 620,118" marker-end="url(#ah-containers)"/><text class="s" x="628" y="98" font-size="12" text-anchor="start">HTTPS</text><rect class="g" x="20" y="120" width="1200" height="130" rx="8" stroke-width="1.25"/><text class="t" x="32" y="140" font-size="13">Global layer (holds no employee personal data)</text><rect class="n" x="40" y="160" width="270" height="70" rx="6" stroke-width="1.25"/><text class="t" x="175.0" y="183.5" font-size="13" text-anchor="middle">Edge</text><text class="s" x="175.0" y="199.5" font-size="12" text-anchor="middle">CloudFront · WAF · Shield</text><text class="s" x="175.0" y="215.5" font-size="12" text-anchor="middle">static web assets, DDoS</text><rect class="n" x="330" y="160" width="210" height="70" rx="6" stroke-width="1.25"/><text class="t" x="435.0" y="183.5" font-size="13" text-anchor="middle">DNS</text><text class="s" x="435.0" y="199.5" font-size="12" text-anchor="middle">Route 53</text><text class="s" x="435.0" y="215.5" font-size="12" text-anchor="middle">regional hostnames</text><rect class="na" x="560" y="160" width="420" height="70" rx="6" stroke-width="1.25"/><text class="ta" x="770.0" y="183.5" font-size="13" text-anchor="middle">Control plane services</text><text class="s" x="770.0" y="199.5" font-size="12" text-anchor="middle">tenant registry · provisioning · plans and entitlements</text><text class="s" x="770.0" y="215.5" font-size="12" text-anchor="middle">metering and billing · developer apps · releases</text><rect class="n" x="1000" y="160" width="200" height="70" rx="6" stroke-width="1.25"/><text class="t" x="1100.0" y="183.5" font-size="13" text-anchor="middle">Routing map</text><text class="s" x="1100.0" y="199.5" font-size="12" text-anchor="middle">DynamoDB global table</text><text class="s" x="1100.0" y="215.5" font-size="12" text-anchor="middle">tenant → region → cell</text><polyline class="e" points="380,250 380,298" marker-end="url(#ah-containers)"/><text class="s" x="388" y="280" font-size="12" text-anchor="start">API calls (api.in.…)</text><rect class="g" x="20" y="270" width="1200" height="590" rx="8" stroke-width="1.25"/><text class="t" x="32" y="290" font-size="13">Region: India · Mumbai (DR in Hyderabad)</text><rect class="na" x="40" y="300" width="370" height="64" rx="6" stroke-width="1.25"/><text class="ta" x="225.0" y="328.5" font-size="13" text-anchor="middle">API gateway (Kong)</text><text class="s" x="225.0" y="344.5" font-size="12" text-anchor="middle">OAuth/JWT · quotas · routing to the home cell</text><rect class="n" x="430" y="300" width="370" height="64" rx="6" stroke-width="1.25"/><text class="t" x="615.0" y="328.5" font-size="13" text-anchor="middle">Identity (Keycloak)</text><text class="s" x="615.0" y="344.5" font-size="12" text-anchor="middle">realm or organisation per tenant · SSO · OTP</text><rect class="n" x="820" y="300" width="380" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1010.0" y="328.5" font-size="13" text-anchor="middle">Analytics</text><text class="s" x="1010.0" y="344.5" font-size="12" text-anchor="middle">ClickHouse + Cube, tenant-partitioned</text><rect class="g" x="40" y="390" width="1160" height="450" rx="8" stroke-width="1.25"/><text class="t" x="52" y="410" font-size="13">Cell IN-1 (pooled) · one of N identical cells</text><rect class="na" x="60" y="430" width="380" height="92" rx="6" stroke-width="1.25"/><text class="ta" x="250.0" y="456.5" font-size="13" text-anchor="middle">Core platform app (modular monolith)</text><text class="s" x="250.0" y="472.5" font-size="12" text-anchor="middle">Public API v1 · Experience API · SCIM · Admin API</text><text class="s" x="250.0" y="488.5" font-size="12" text-anchor="middle">domain modules on the platform kernel</text><text class="s" x="250.0" y="504.5" font-size="12" text-anchor="middle">Java 21 · Spring Boot · Spring Modulith</text><polyline class="e" points="400,364 400,428" marker-end="url(#ah-containers)"/><text class="s" x="408" y="384" font-size="12" text-anchor="start">routes by tenant</text><rect class="n" x="60" y="580" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="153.0" y="609.5" font-size="12" text-anchor="middle">Attendance ingestion</text><rect class="n" x="254" y="580" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="347.0" y="609.5" font-size="12" text-anchor="middle">Workflow workers</text><rect class="n" x="60" y="642" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="153.0" y="671.5" font-size="12" text-anchor="middle">Notification service</text><rect class="n" x="254" y="642" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="347.0" y="671.5" font-size="12" text-anchor="middle">Webhook dispatcher (Svix)</text><rect class="n" x="60" y="704" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="153.0" y="733.5" font-size="12" text-anchor="middle">Document service</text><rect class="n" x="254" y="704" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="347.0" y="733.5" font-size="12" text-anchor="middle">Integration workers</text><rect class="n" x="60" y="766" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="153.0" y="795.5" font-size="12" text-anchor="middle">Search indexer</text><rect class="n" x="254" y="766" width="186" height="50" rx="6" stroke-width="1.25"/><text class="t" x="347.0" y="795.5" font-size="12" text-anchor="middle">Export and report workers</text><text class="t" x="60" y="570" font-size="12" text-anchor="start">Satellite services: consume events, write to the cell stores</text><text class="t" x="520" y="420" font-size="12" text-anchor="start">Cell data stores (never shared across cells)</text><rect class="n" x="520" y="432" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="680.0" y="463.5" font-size="13" text-anchor="middle">Aurora PostgreSQL</text><text class="s" x="680.0" y="479.5" font-size="12" text-anchor="middle">system of record, RLS</text><rect class="n" x="860" y="432" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="1020.0" y="463.5" font-size="13" text-anchor="middle">Kafka (MSK)</text><text class="s" x="1020.0" y="479.5" font-size="12" text-anchor="middle">domain events, CDC</text><rect class="n" x="520" y="528" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="680.0" y="559.5" font-size="13" text-anchor="middle">Temporal</text><text class="s" x="680.0" y="575.5" font-size="12" text-anchor="middle">durable workflows, timers</text><rect class="n" x="860" y="528" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="1020.0" y="559.5" font-size="13" text-anchor="middle">OpenSearch</text><text class="s" x="1020.0" y="575.5" font-size="12" text-anchor="middle">search, trimmed by access</text><rect class="n" x="520" y="624" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="680.0" y="655.5" font-size="13" text-anchor="middle">ElastiCache (Valkey)</text><text class="s" x="680.0" y="671.5" font-size="12" text-anchor="middle">cache, rate-limit counters</text><rect class="n" x="860" y="624" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="1020.0" y="655.5" font-size="13" text-anchor="middle">S3</text><text class="s" x="1020.0" y="671.5" font-size="12" text-anchor="middle">documents, exports, archive</text><rect class="n" x="520" y="720" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="680.0" y="751.5" font-size="13" text-anchor="middle">KMS</text><text class="s" x="680.0" y="767.5" font-size="12" text-anchor="middle">per-tenant data keys</text><rect class="n" x="860" y="720" width="320" height="70" rx="6" stroke-width="1.25"/><text class="t" x="1020.0" y="751.5" font-size="13" text-anchor="middle">Secrets Manager</text><text class="s" x="1020.0" y="767.5" font-size="12" text-anchor="middle">platform secrets</text><polyline class="e" points="440,476 518,476" marker-end="url(#ah-containers)"/><text class="s" x="479" y="468" font-size="12" text-anchor="middle">read/write</text><polyline class="e" points="448,705 482,705 482,560 518,560" marker-end="url(#ah-containers)"/><polyline class="e" points="1030,432 1030,366" marker-end="url(#ah-containers)"/><text class="s" x="1038" y="404" font-size="12" text-anchor="start">CDC</text></svg>