tomer IT, ISVs, iPaaS</text><text class="s" x="145.0" y="477.5" font-size="12" text-anchor="middle">REST API, webhooks, portal</text><polyline class="e" points="270,457 438,332" marker-end="url(#ah-context)"/><rect class="np" x="20" y="520" width="250" height="70" rx="14" stroke-width="1.25"/><text class="t" x="145.0" y="543.5" font-size="13" text-anchor="middle">Platform operators</text><text class="s" x="145.0" y="559.5" font-size="12" text-anchor="middle">SRE, support, billing</text><text class="s" x="145.0" y="575.5" font-size="12" text-anchor="middle">ops console, JIT access</text><polyline class="e" points="270,555 438,352" marker-end="url(#ah-context)"/><rect class="nx" x="930" y="18" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="38.5" font-size="13" text-anchor="middle">Identity providers</text><text class="s" x="1055.0" y="54.5" font-size="12" text-anchor="middle">Entra ID · Google · Okta</text><text class="s" x="1055.0" y="70.5" font-size="12" text-anchor="middle">SSO and SCIM, both ways</text><polyline class="e" points="762,244 928,50" marker-end="url(#ah-context)" marker-start="url(#ah-context)"/><rect class="nx" x="930" y="94" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="114.5" font-size="13" text-anchor="middle">Attendance devices</text><text class="s" x="1055.0" y="130.5" font-size="12" text-anchor="middle">biometric terminals, site agents</text><text class="s" x="1055.0" y="146.5" font-size="12" text-anchor="middle">push punches in</text><polyline class="e" points="928,126 762,262" marker-end="url(#ah-context)"/><rect class="nx" x="930" y="170" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="190.5" font-size="13" text-anchor="middle">Payroll, ERP, accounting</text><text class="s" x="1055.0" y="206.5" font-size="12" text-anchor="middle">SAP · Tally · others</text><text class="s" x="1055.0" y="222.5" font-size="12" text-anchor="middle">receive payroll inputs, journals</text><polyline class="e" points="762,280 928,202" marker-end="url(#ah-context)"/><rect class="nx" x="930" y="246" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="266.5" font-size="13" text-anchor="middle">Messaging providers</text><text class="s" x="1055.0" y="282.5" font-size="12" text-anchor="middle">email · SMS (DLT) · WhatsApp · push</text><text class="s" x="1055.0" y="298.5" font-size="12" text-anchor="middle">deliver notifications</text><polyline class="e" points="762,298 928,278" marker-end="url(#ah-context)"/><rect class="nx" x="930" y="322" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="342.5" font-size="13" text-anchor="middle">Job boards and verification</text><text class="s" x="1055.0" y="358.5" font-size="12" text-anchor="middle">Naukri · LinkedIn · BGV · e-sign</text><text class="s" x="1055.0" y="374.5" font-size="12" text-anchor="middle">post jobs, verify, sign</text><polyline class="e" points="762,316 928,354" marker-end="url(#ah-context)"/><rect class="nx" x="930" y="398" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="418.5" font-size="13" text-anchor="middle">Customer SIEM and iPaaS</text><text class="s" x="1055.0" y="434.5" font-size="12" text-anchor="middle">Splunk · Sentinel · Workato</text><text class="s" x="1055.0" y="450.5" font-size="12" text-anchor="middle">receive audit and events</text><polyline class="e" points="762,334 928,430" marker-end="url(#ah-context)"/><rect class="nx" x="930" y="474" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="494.5" font-size="13" text-anchor="middle">Billing and payments</text><text class="s" x="1055.0" y="510.5" font-size="12" text-anchor="middle">Chargebee · Razorpay</text><text class="s" x="1055.0" y="526.5" font-size="12" text-anchor="middle">usage, invoices, GST</text><polyline class="e" points="762,352 928,506" marker-end="url(#ah-context)"/><rect class="nx" x="930" y="550" width="250" height="64" rx="6" stroke-width="1.25"/><text class="t" x="1055.0" y="570.5" font-size="13" text-anchor="middle">Government portals</text><text class="s" x="1055.0" y="586.5" font-size="12" text-anchor="middle">EPFO · ESIC</text><text class="s" x="1055.0" y="602.5" font-size="12" text-anchor="middle">links out; evidence kept here</text><polyline class="e" points="762,370 928,582" marker-end="url(#ah-context)"/></svg>