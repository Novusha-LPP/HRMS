<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="System context: six groups of people use the HRMS Platform through the HR console, employee app, admin console, careers portal, API and ops console; the platform exchanges data with identity providers, attendance devices, payroll and ERP systems, messaging providers, job boards and verification services, customer SIEM and iPaaS tools, billing, and government portals." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1199" height="639" rx="10"/><rect class="na" x="440" y="230" width="320" height="150" rx="6" stroke-width="1.25"/><text class="ta" x="600.0" y="285.5" font-size="15" text-anchor="middle">HRMS Platform</text><text class="s" x="600.0" y="301.5" font-size="12" text-anchor="middle">multi-tenant SaaS, one home region per tenant</text><text class="s" x="600.0" y="317.5" font-size="12" text-anchor="middle">HR console · employee app · admin console</text><text class="s" x="600.0" y="333.5" font-size="12" text-anchor="middle">public API · webhooks · developer portal</text><rect class="np" x="20" y="30" width="250" height="70" rx="14" stroke-width="1.25"/