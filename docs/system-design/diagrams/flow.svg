<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="A personnel action is approved, applied on its effective date as an effective-dated write plus audit entry in one transaction, and published as an event that every other module consumes." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="999" height="439" rx="10"/><rect class="n" x="20" y="30" width="200" height="76" rx="6" stroke-width="1.25"/><text class="t" x="120.0" y="56.5" font-size="13" text-anchor="middle">Personnel action</text><text class="s" x="120.0" y="72.5" font-size="12" text-anchor="middle">Transfer to Vadodara</text><text class="s" x="120.0" y="88.5" font-size="12" text-anchor="middle">effective 01 Oct 2026</text><rect class="n" x="270" y="30" width="200" height="76" rx="6" stroke-width="1.25"/><text class="t" x="370.0" y="56.5" font-size="13" text-anchor="middle">Approval workflow</text><text class="s" x="370.0" y="72.5" font-size="12" text-anchor="middle">line manager → HR</text><text class="s" x="370.0" y="88.5" font-size="12" text-anchor="middle">reason required</text><rect class="n" x="520" y="30" width="200" height="76" rx="6" stroke-width="1.25"/><text class="t" x="620.0" y="56.5" font-size="13" text-anchor="middle">Scheduler</text><text class="s" x="620.0" y="72.5" font-size="12" text-anchor="middle">applies it on</text><text class="s" x="620.0" y="88.5" font-size="12" text-anchor="middle">01 Oct 2026</text><rect class="na" x="770" y="30" width="200" height="76" rx="6" stroke-width="1.25"/><text class="ta" x="870.0" y="56.5" font-size="13" text-anchor="middle">One transaction</text><text class="s" x="870.0" y="72.5" font-size="12" text-anchor="middle">assignment slice + audit</text><text class="s" x="870.0" y="88.5" font-size="12" text-anchor="middle">+ outbox record</text><polyline class="e" points="220,68 268,68" marker-end="url(#ah-flow)"/><text class="s" x="244.0" y="60" font-size="12" text-anchor="middle">submit</text><polyline class="e" points="470,68 518,68" marker-end="url(#ah-flow)"/><text class="s" x="494.0" y="60" font-size="12" text-anchor="middle">approve</text><polyline class="e" points="720,68 768,68" marker-end="url(#ah-flow)"/><text class="s" x="744.0" y="60" font-size="12" text-anchor="middle">on date</text><rect class="n" x="300" y="170" width="400" height="56" rx="6" stroke-width="1.25"/><text class="t" x="500.0" y="194.5" font-size="13" text-anchor="middle">Event bus (per cell)</text><text class="s" x="500.0" y="210.5" font-size="12" text-anchor="middle">AssignmentChanged · tenant · employee · from → to · effective</text><polyline class="e" points="870,106 870,140 500,140 500,168" marker-end="url(#ah-flow)"/><text class="s" x="690" y="134" font-size="12" text-anchor="middle">publish</text><rect class="n" x="20" y="300" width="128" height="76" rx="6" stroke-width="1.25"/><text class="t" x="84.0" y="326.5" font-size="12" text-anchor="middle">Attendance</text><text class="s" x="84.0" y="342.5" font-size="12" text-anchor="middle">new shift &amp; holiday</text><text class="s" x="84.0" y="358.5" font-size="12" text-anchor="middle">calendar from 01 Oct</text><polyline class="e" points="500,226 500,262 84,262 84,298" marker-end="url(#ah-flow)"/><rect class="n" x="158" y="300" width="128" height="76" rx="6" stroke-width="1.25"/><text class="t" x="222.0" y="326.5" font-size="12" text-anchor="middle">Leave</text><text class="s" x="222.0" y="342.5" font-size="12" text-anchor="middle">location holidays</text><text class="s" x="222.0" y="358.5" font-size="12" text-anchor="middle">in balance maths</text><polyline class="e" points="500,226 500,262 222,262 222,298" marker-end="url(#ah-flow)"/><rect class="n" x="296" y="300" width="128" height="76" rx="6" stroke-width="1.25"/><text class="t" x="360.0" y="326.5" font-size="12" text-anchor="middle">Access</text><text class="s" x="360.0" y="342.5" font-size="12" text-anchor="middle">recompute who</text><text class="s" x="360.0" y="358.5" font-size="12" text-anchor="middle">can see her</text><polyline class="e" points="500,226 500,262 360,262 360,298" marker-end="url(#ah-flow)"/><rect class="n" x="434" y="300" width="128" height="76" rx="6" stroke-width="1.25"/><text class="t" x="498.0" y="326.5" font-size="12" text-anchor="middle">Action Centre</text><text class="s" x="498.0" y="342.5" font-size="12" text-anchor="middle">induction at</text><text class="s" x="498.0" y="358.5" font-size="12" text-anchor="middle">the new site</text><polyline class="e" points="500,226 500,262 498,262 498,298" marker-end="url(#ah-flow)"/><rect class="n" x="572" y="300" width="128" height="76" rx="6" stroke-width="1.25"/><text class="t" x="636.0" y="326.5" font-size="12" text-anchor="middle">Notifications</text><text class="s" x="636.0" y="342.5" font-size="12" text-anchor="middle">employee, old and</text><text class="s" x="636.0" y="358.5" font-size="12" text-anchor="middle">new manager</text><polyline class="e" points="500,226 500,262 636,262 636,298" marker-end="url(#ah-flow)"/><rect class="n" x="710" y="300" width="128" height="76" rx="6" stroke-width="1.25"/><text class="t" x="774.0" y="326.5" font-size="12" text-anchor="middle">Search &amp; reads</text><text class="s" x="774.0" y="342.5" font-size="12" text-anchor="middle">index, 360,</text><text class="s" x="774.0" y="358.5" font-size="12" text-anchor="middle">dashboards</text><polyline class="e" points="500,226 500,262 774,262 774,298" marker-end="url(#ah-flow)"/><rect class="n" x="848" y="300" width="128" height="76" rx="6" stroke-width="1.25"/><text class="t" x="912.0" y="326.5" font-size="12" text-anchor="middle">Webhooks</text><text class="s" x="912.0" y="342.5" font-size="12" text-anchor="middle">directory,</text><text class="s" x="912.0" y="358.5" font-size="12" text-anchor="middle">payroll, ERP</text><polyline class="e" points="500,226 500,262 912,262 912,298" marker-end="url(#ah-flow)"/><text class="s" x="20" y="410" font-size="12" text-anchor="start">Modules never read each other's tables; they react to events. A retro-dated action also triggers recalculation of the affected periods.</text></svg>