<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Inside the core platform app: interfaces on top, twelve domain modules, twelve platform-kernel modules, and infrastructure adapters; modules talk through published interfaces and events, never shared tables." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-monolith" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1199" height="639" rx="10"/><rect class="g" x="20" y="20" width="1160" height="98" rx="8" stroke-width="1.25"/><text class="t" x="32" y="40" font-size="13">Interfaces</text><rect class="n" x="40.0" y="52" width="214.4" height="48" rx="6" stroke-width="1.25"/><text class="t" x="147.2" y="80.5" font-size="12" text-anchor="middle">Public REST API v1</text><rect class="n" x="266.4" y="52" width="214.4" height="48" rx="6" stroke-width="1.25"/><text class="t" x="373.59999999999997" y="80.5" font-size="12" text-anchor="middle">Experience API (web, mobile)</text><rect class="n" x="492.8" y="52" width="214.4" height="48" rx="6" stroke-width="1.25"/><text class="t" x="600.0" y="80.5" font-size="12" text-anchor="middle">SCIM 2.0</text><rect class="n" x="719.2" y="52" width="214.4" height="48" rx="6" stroke-width="1.25"/><text class="t" x="826.4000000000001" y="80.5" font-size="12" text-anchor="middle">Admin and configuration API</text><rect class="n" x="945.6" y="52" width="214.4" height="48" rx="6" stroke-width="1.25"/><text class="t" x="1052.8" y="80.5" font-size="12" text-anchor="middle">Event consumers (Kafka)</text><rect class="g" x="20" y="140" width="1160" height="156" rx="8" stroke-width="1.25"/><text class="t" x="32" y="160" font-size="13">Domain modules (bounded contexts)</text><rect class="na" x="40.0" y="172" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="128.33333333333331" y="200.5" font-size="12" text-anchor="middle">Organisation</text><rect class="na" x="228.66666666666666" y="172" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="317.0" y="200.5" font-size="12" text-anchor="middle">People and actions</text><rect class="na" x="417.3333333333333" y="172" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="505.66666666666663" y="200.5" font-size="12" text-anchor="middle">Talent</text><rect class="na" x="606.0" y="172" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="694.3333333333334" y="200.5" font-size="12" text-anchor="middle">Time</text><rect class="na" x="794.6666666666666" y="172" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="883.0" y="200.5" font-size="12" text-anchor="middle">Absence</text><rect class="na" x="983.3333333333333" y="172" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="1071.6666666666665" y="200.5" font-size="12" text-anchor="middle">Learning</text><rect class="na" x="40.0" y="230" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="128.33333333333331" y="258.5" font-size="12" text-anchor="middle">Assets</text><rect class="na" x="228.66666666666666" y="230" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="317.0" y="258.5" font-size="12" text-anchor="middle">Separation</text><rect class="na" x="417.3333333333333" y="230" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="505.66666666666663" y="258.5" font-size="12" text-anchor="middle">Compliance packs</text><rect class="na" x="606.0" y="230" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="694.3333333333334" y="258.5" font-size="12" text-anchor="middle">Service desk</text><rect class="na" x="794.6666666666666" y="230" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="883.0" y="258.5" font-size="12" text-anchor="middle">Policies</text><rect class="na" x="983.3333333333333" y="230" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="ta" x="1071.6666666666665" y="258.5" font-size="12" text-anchor="middle">Comp. and payroll inputs</text><rect class="g" x="20" y="318" width="1160" height="156" rx="8" stroke-width="1.25"/><text class="t" x="32" y="338" font-size="13">Platform kernel (shared by every module)</text><rect class="n" x="40.0" y="350" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="128.33333333333331" y="378.5" font-size="12" text-anchor="middle">Tenancy context</text><rect class="n" x="228.66666666666666" y="350" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="317.0" y="378.5" font-size="12" text-anchor="middle">Authorization</text><rect class="n" x="417.3333333333333" y="350" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="505.66666666666663" y="378.5" font-size="12" text-anchor="middle">Config and rules (CEL)</text><rect class="n" x="606.0" y="350" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="694.3333333333334" y="378.5" font-size="12" text-anchor="middle">Workflow (Temporal)</text><rect class="n" x="794.6666666666666" y="350" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="883.0" y="378.5" font-size="12" text-anchor="middle">Obligations and tasks</text><rect class="n" x="983.3333333333333" y="350" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="1071.6666666666665" y="378.5" font-size="12" text-anchor="middle">Exceptions</text><rect class="n" x="40.0" y="408" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="128.33333333333331" y="436.5" font-size="12" text-anchor="middle">Audit</text><rect class="n" x="228.66666666666666" y="408" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="317.0" y="436.5" font-size="12" text-anchor="middle">Documents and letters</text><rect class="n" x="417.3333333333333" y="408" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="505.66666666666663" y="436.5" font-size="12" text-anchor="middle">Notifications</text><rect class="n" x="606.0" y="408" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="694.3333333333334" y="436.5" font-size="12" text-anchor="middle">Numbering</text><rect class="n" x="794.6666666666666" y="408" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="883.0" y="436.5" font-size="12" text-anchor="middle">Custom fields, forms</text><rect class="n" x="983.3333333333333" y="408" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="1071.6666666666665" y="436.5" font-size="12" text-anchor="middle">Terminology, i18n</text><rect class="g" x="20" y="496" width="1160" height="98" rx="8" stroke-width="1.25"/><text class="t" x="32" y="516" font-size="13">Infrastructure adapters</text><rect class="n" x="40.0" y="528" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="128.33333333333331" y="556.5" font-size="12" text-anchor="middle">PostgreSQL + RLS</text><rect class="n" x="228.66666666666666" y="528" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="317.0" y="556.5" font-size="12" text-anchor="middle">Outbox → Kafka</text><rect class="n" x="417.3333333333333" y="528" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="505.66666666666663" y="556.5" font-size="12" text-anchor="middle">Temporal SDK</text><rect class="n" x="606.0" y="528" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="694.3333333333334" y="556.5" font-size="12" text-anchor="middle">OpenSearch client</text><rect class="n" x="794.6666666666666" y="528" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="883.0" y="556.5" font-size="12" text-anchor="middle">S3 and KMS</text><rect class="n" x="983.3333333333333" y="528" width="176.66666666666666" height="48" rx="6" stroke-width="1.25"/><text class="t" x="1071.6666666666665" y="556.5" font-size="12" text-anchor="middle">Cache (Valkey)</text><polyline class="e" points="600,118 600,138" marker-end="url(#ah-monolith)"/><polyline class="e" points="600,296 600,316" marker-end="url(#ah-monolith)"/><polyline class="e" points="600,474 600,494" marker-end="url(#ah-monolith)"/><text class="s" x="20" y="622" font-size="12" text-anchor="start">Each module owns its tables and publishes events; the build fails if a module reads another module's tables (Spring Modulith + ArchUnit checks).</text></svg>