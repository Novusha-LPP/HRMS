<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1120 460" width="1120" height="460" role="img" aria-label="People &amp; Employment Data Model: Person, Employments, Effective-Dated Assignments, Custom ID Schemes, KYC Records, and Personnel Actions." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff;stroke:#d5dde1}
    .n{fill:#f4f6f7;stroke:#7b8a92}
    .na{fill:#ddeaea;stroke:#0d6b6b}
    .nb{fill:#eff6ff;stroke:#3b82f6}
    .g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}
    .t{fill:#16222a;font-weight:600}
    .s{fill:#4f5e67}
    .ta{fill:#0d6b6b;font-weight:600}
    .tb{fill:#1e40af;font-weight:600}
    .e{fill:none;stroke:#4f5e67;stroke-width:1.5}
    .ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}
    .ah{fill:#4f5e67}
  </style>
  <defs>
    <marker id="ah-people" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0.5" y="0.5" width="1119" height="459" rx="10"/>

  <text class="t" x="30" y="32" font-size="14">People &amp; Employment Model: Entity Separation &amp; Effective Dating</text>
  <text class="s" x="30" y="50" font-size="12">One human Person can hold multiple Employments across companies or rehires, each with temporal Assignment slices and KYC compliance.</text>

  <!-- 1. PERSON ENTITY -->
  <rect class="na" x="30" y="90" width="220" height="150" rx="6" stroke-width="1.25"/>
  <text class="ta" x="140" y="115" font-size="13" text-anchor="middle">Person (Human Entity)</text>
  <text class="s" x="46" y="138" font-size="11">• id: UUID (Primary Key)</text>
  <text class="s" x="46" y="156" font-size="11">• legal_first_name, legal_last_name</text>
  <text class="s" x="46" y="174" font-size="11">• date_of_birth, gender, nationality</text>
  <text class="s" x="46" y="192" font-size="11">• custom_fields: JSONB</text>
  <text class="s" x="46" y="210" font-size="10">Created once; survives across</text>
  <text class="s" x="46" y="224" font-size="10">rehires &amp; company transfers.</text>

  <!-- 2. EMPLOYMENT 1 -->
  <rect class="n" x="320" y="70" width="240" height="154" rx="6" stroke-width="1.25"/>
  <text class="t" x="440" y="94" font-size="13" text-anchor="middle">Employment 1 (Company A)</text>
  <text class="s" x="334" y="116" font-size="11">• legal_entity_id: Suraj Polymers</text>
  <text class="t" x="334" y="134" font-size="11">• employee_number: SP-24-00142</text>
  <text class="s" x="334" y="150" font-size="10">  (Generated via EmployeeIdScheme)</text>
  <text class="s" x="334" y="168" font-size="11">• hire_date: 2024-02-01</text>
  <text class="s" x="334" y="186" font-size="11">• separation_date: 2026-06-30</text>
  <text class="s" x="334" y="204" font-size="11">• state: SEPARATED</text>

  <!-- 2. EMPLOYMENT 2 -->
  <rect class="nb" x="320" y="250" width="240" height="154" rx="6" stroke-width="1.25"/>
  <text class="tb" x="440" y="274" font-size="13" text-anchor="middle">Employment 2 (Company B / Transfer)</text>
  <text class="s" x="334" y="296" font-size="11">• legal_entity_id: Suraj Logistics</text>
  <text class="t" x="334" y="314" font-size="11">• employee_number: SL-26-00088</text>
  <text class="s" x="334" y="330" font-size="10">  (Fresh sequential ID for sister co.)</text>
  <text class="s" x="334" y="348" font-size="11">• hire_date: 2026-07-01</text>
  <text class="s" x="334" y="366" font-size="11">• separation_date: NULL (Current)</text>
  <text class="s" x="334" y="384" font-size="11">• state: ACTIVE</text>

  <polyline class="e" points="250,140 318,140" marker-end="url(#ah-people)"/>
  <polyline class="e" points="250,170 280,170 280,320 318,320" marker-end="url(#ah-people)"/>

  <!-- 3. ASSIGNMENT SLICES (TIMELINE) -->
  <rect class="g" x="600" y="70" width="490" height="154" rx="6" stroke-width="1.25"/>
  <text class="t" x="614" y="94" font-size="12">Employment 1: Assignment Slices (effective_from → effective_to)</text>

  <rect class="n" x="614" y="106" width="215" height="100" rx="4"/>
  <text class="t" x="721" y="126" font-size="11" text-anchor="middle">Assignment Slice A</text>
  <text class="s" x="626" y="146" font-size="10">• 2024-02-01 → 2025-03-31</text>
  <text class="s" x="626" y="162" font-size="10">• Dept: Quality · Role: Executive</text>
  <text class="s" x="626" y="178" font-size="10">• Loc: Plant 1 · Manager: Rajesh</text>
  <text class="s" x="626" y="194" font-size="10">• Position: QC-01</text>

  <rect class="n" x="845" y="106" width="230" height="100" rx="4"/>
  <text class="t" x="960" y="126" font-size="11" text-anchor="middle">Assignment Slice B (Promotion)</text>
  <text class="s" x="857" y="146" font-size="10">• 2025-04-01 → 2026-06-30</text>
  <text class="s" x="857" y="162" font-size="10">• Dept: Quality · Role: Sr Executive</text>
  <text class="s" x="857" y="178" font-size="10">• Loc: Plant 1 · Manager: Suresh</text>
  <text class="s" x="857" y="194" font-size="10">• Mutated via PersonnelAction HIRE/PROMO</text>

  <polyline class="e" points="560,147 598,147" marker-end="url(#ah-people)"/>

  <!-- 4. EMPLOYEE KYC & COMPLIANCE -->
  <rect class="na" x="600" y="250" width="490" height="154" rx="6" stroke-width="1.25"/>
  <text class="ta" x="614" y="274" font-size="12">Statutory KYC Record &amp; Documents (`modules/kyc`)</text>

  <rect class="n" x="614" y="286" width="220" height="100" rx="4"/>
  <text class="t" x="724" y="306" font-size="11" text-anchor="middle">EmployeeKycRecord</text>
  <text class="s" x="626" y="324" font-size="10">• PAN: ABCDE1234F · Aadhaar: Masked</text>
  <text class="s" x="626" y="338" font-size="10">• UAN: 100234567890 · PF &amp; ESI</text>
  <text class="s" x="626" y="352" font-size="10">• Bank: HDFC · A/c: 50100... · IFSC</text>
  <text class="s" x="626" y="366" font-size="10">• Emergency contact &amp; address</text>
  <text class="ta" x="626" y="380" font-size="10">• Status: SUBMITTED → VERIFIED</text>

  <rect class="n" x="850" y="286" width="225" height="100" rx="4"/>
  <text class="t" x="962" y="306" font-size="11" text-anchor="middle">EmployeeKycDocument</text>
  <text class="s" x="862" y="324" font-size="10">• PAN Card (PDF/Image)</text>
  <text class="s" x="862" y="338" font-size="10">• Aadhaar Front &amp; Back</text>
  <text class="s" x="862" y="352" font-size="10">• Cancelled Cheque / Passbook</text>
  <text class="s" x="862" y="366" font-size="10">• Stored at: /app/storage/kyc/</text>
  <text class="s" x="862" y="380" font-size="10">• Verified by HR manager with notes</text>

  <polyline class="e" points="560,327 598,327" marker-end="url(#ah-people)"/>

  <!-- BOTTOM CAPTION -->
  <text class="s" x="30" y="435" font-size="11">Assignments are effective-dated and immutable once past. A PersonnelAction is the only write path for modifying employment assignments.</text>
</svg>