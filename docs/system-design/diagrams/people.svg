<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-label="One person has one or more employments with legal entities; each employment is a series of effective-dated assignment slices, including scheduled future slices; an inter-company transfer ends one employment and starts a linked one." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-people" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1099" height="419" rx="10"/><text class="t" x="470" y="34" font-size="12" text-anchor="start">Assignment slices on the valid-time axis  (effective_from → effective_to)</text><line class="l" x1="470" y1="44" x2="1080" y2="44"/><rect class="n" x="20" y="160" width="170" height="100" rx="6" stroke-width="1.25"/><text class="t" x="105.0" y="190.5" font-size="13" text-anchor="middle">Person</text><text class="s" x="105.0" y="206.5" font-size="12" text-anchor="middle">one per human, per tenant</text><text class="s" x="105.0" y="222.5" font-size="12" text-anchor="middle">identity · contacts · family</text><text class="s" x="105.0" y="238.5" font-size="12" text-anchor="middle">vault for PAN / UAN / bank</text><rect class="n" x="240" y="60" width="200" height="80" rx="6" stroke-width="1.25"/><text class="t" x="340.0" y="88.5" font-size="13" text-anchor="middle">Employment 1</text><text class="s" x="340.0" y="104.5" font-size="12" text-anchor="middle">Kaveri Polymers</text><text class="s" x="340.0" y="120.5" font-size="12" text-anchor="middle">KP-24-00212</text><rect class="n" x="240" y="240" width="200" height="80" rx="6" stroke-width="1.25"/><text class="t" x="340.0" y="268.5" font-size="13" text-anchor="middle">Employment 2</text><text class="s" x="340.0" y="284.5" font-size="12" text-anchor="middle">Kaveri Logistics</text><text class="s" x="340.0" y="300.5" font-size="12" text-anchor="middle">new or same ID: tenant rule</text><polyline class="e" points="190,195 215,195 215,100 238,100" marker-end="url(#ah-people)"/><text class="s" x="206" y="150" font-size="12" text-anchor="end">has</text><polyline class="e" points="190,225 215,225 215,280 238,280" marker-end="url(#ah-people)"/><polyline class="ed" points="340,140 340,238" marker-end="url(#ah-people)"/><text class="s" x="350" y="180" font-size="12" text-anchor="start">inter-company transfer:</text><text class="s" x="350" y="195" font-size="12" text-anchor="start">end one, start one, linked</text><rect class="n" x="470" y="70" width="170" height="60" rx="6" stroke-width="1.25"/><text class="t" x="555.0" y="96.5" font-size="12" text-anchor="middle">Feb 2024 → Mar 2026</text><text class="s" x="555.0" y="112.5" font-size="12" text-anchor="middle">Pune · Executive</text><rect class="n" x="646" y="70" width="140" height="60" rx="6" stroke-width="1.25"/><text class="t" x="716.0" y="96.5" font-size="12" text-anchor="middle">Mar → Jun 2026</text><text class="s" x="716.0" y="112.5" font-size="12" text-anchor="middle">new manager</text><rect class="n" x="792" y="250" width="140" height="60" rx="6" stroke-width="1.25"/><text class="t" x="862.0" y="276.5" font-size="12" text-anchor="middle">Jul → Sep 2026</text><text class="s" x="862.0" y="292.5" font-size="12" text-anchor="middle">Vadodara · Sr Exec</text><rect class="na" x="938" y="250" width="142" height="60" rx="6" stroke-width="1.25"/><text class="ta" x="1009.0" y="276.5" font-size="12" text-anchor="middle">Oct 2026 →</text><text class="s" x="1009.0" y="292.5" font-size="12" text-anchor="middle">Asst Manager</text><text class="ta" x="1009" y="330" font-size="12" text-anchor="middle">scheduled</text><line class="l" x1="922" y1="52" x2="922" y2="340"/><text class="t" x="922" y="356" font-size="12" text-anchor="middle">today</text><polyline class="e" points="440,100 468,100" marker-end="url(#ah-people)"/><polyline class="e" points="440,280 790,280" marker-end="url(#ah-people)"/><text class="t" x="20" y="368" font-size="12" text-anchor="start">Each slice points to effective-dated dimensions:</text><rect class="n" x="20" y="380" width="78" height="26" rx="6" stroke-width="1.25"/><text class="t" x="59.0" y="397.5" font-size="12" text-anchor="middle">Org unit</text><rect class="n" x="106" y="380" width="78" height="26" rx="6" stroke-width="1.25"/><text class="t" x="145.0" y="397.5" font-size="12" text-anchor="middle">Location</text><rect class="n" x="192" y="380" width="99" height="26" rx="6" stroke-width="1.25"/><text class="t" x="241.5" y="397.5" font-size="12" text-anchor="middle">Job &amp; grade</text><rect class="n" x="299" y="380" width="155" height="26" rx="6" stroke-width="1.25"/><text class="t" x="376.5" y="397.5" font-size="12" text-anchor="middle">Position (optional)</text><rect class="n" x="462" y="380" width="92" height="26" rx="6" stroke-width="1.25"/><text class="t" x="508.0" y="397.5" font-size="12" text-anchor="middle">Manager(s)</text><rect class="n" x="562" y="380" width="99" height="26" rx="6" stroke-width="1.25"/><text class="t" x="611.5" y="397.5" font-size="12" text-anchor="middle">Cost centre</text><rect class="n" x="669" y="380" width="85" height="26" rx="6" stroke-width="1.25"/><text class="t" x="711.5" y="397.5" font-size="12" text-anchor="middle">Pay group</text><rect class="n" x="762" y="380" width="141" height="26" rx="6" stroke-width="1.25"/><text class="t" x="832.5" y="397.5" font-size="12" text-anchor="middle">Custom dimensions</text></svg>