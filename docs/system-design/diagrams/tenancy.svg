<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="A request is resolved to one tenant at the edge, routed to that tenant's home cell, and carries the tenant context into every store; pooled and dedicated cells run the same code and schema." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#ffffff;stroke:#d5dde1}.n{fill:#f4f6f7;stroke:#7b8a92}.na{fill:#ddeaea;stroke:#0d6b6b}.nx{fill:#ffffff;stroke:#7b8a92;stroke-dasharray:5 4}.np{fill:#eceff1;stroke:#7b8a92}.g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}.gs{fill:#f9fbfb;stroke:#9aa7ae}.t{fill:#16222a;font-weight:600}.s{fill:#4f5e67}.ta{fill:#0d6b6b;font-weight:600}.e{fill:none;stroke:#4f5e67;stroke-width:1.5}.ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}.ah{fill:#4f5e67}.l{fill:none;stroke:#b4c0c7;stroke-width:1.25;stroke-dasharray:4 4}</style><defs><marker id="ah-tenancy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="999" height="479" rx="10"/><rect class="n" x="20" y="205" width="130" height="70" rx="6" stroke-width="1.25"/><text class="t" x="85.0" y="236.5" font-size="13" text-anchor="middle">Web · Mobile · API</text><text class="s" x="85.0" y="252.5" font-size="12" text-anchor="middle">kaveri.hrms.app</text><rect class="n" x="200" y="195" width="160" height="90" rx="6" stroke-width="1.25"/><text class="t" x="280.0" y="220.5" font-size="13" text-anchor="middle">Edge</text><text class="s" x="280.0" y="236.5" font-size="12" text-anchor="middle">tenant from host</text><text class="s" x="280.0" y="252.5" font-size="12" text-anchor="middle">+ token; reject if</text><text class="s" x="280.0" y="268.5" font-size="12" text-anchor="middle">they differ</text><polyline class="e" points="150,240 198,240" marker-end="url(#ah-tenancy)"/><rect class="n" x="200" y="30" width="360" height="86" rx="6" stroke-width="1.25"/><text class="t" x="380.0" y="61.5" font-size="13" text-anchor="middle">Control plane · global · no employee data</text><text class="s" x="380.0" y="77.5" font-size="12" text-anchor="middle">tenant → home region → cell</text><text class="s" x="380.0" y="93.5" font-size="12" text-anchor="middle">plan &amp; modules · packs · release ring</text><polyline class="e" points="280,195 280,118" marker-end="url(#ah-tenancy)"/><text class="s" x="288" y="160" font-size="12" text-anchor="start">lookup (cached)</text><rect class="g" x="410" y="150" width="570" height="200" rx="8" stroke-width="1.25"/><text class="t" x="422" y="170" font-size="13">Cell IN-1 · India region · pooled</text><text class="s" x="422" y="186" font-size="12">many tenants share one stack; tenant_id on every row</text><rect class="n" x="428" y="205" width="130" height="70" rx="6" stroke-width="1.25"/><text class="t" x="493.0" y="236.5" font-size="13" text-anchor="middle">API / BFF</text><text class="s" x="493.0" y="252.5" font-size="12" text-anchor="middle">sets tenant context</text><rect class="n" x="588" y="205" width="150" height="70" rx="6" stroke-width="1.25"/><text class="t" x="663.0" y="228.5" font-size="13" text-anchor="middle">Modules &amp; workers</text><text class="s" x="663.0" y="244.5" font-size="12" text-anchor="middle">context carried into</text><text class="s" x="663.0" y="260.5" font-size="12" text-anchor="middle">every job and event</text><polyline class="e" points="558,240 586,240" marker-end="url(#ah-tenancy)"/><rect class="na" x="770" y="190" width="196" height="32" rx="6" stroke-width="1.25"/><text class="ta" x="868.0" y="210.5" font-size="12" text-anchor="middle">Postgres · RLS on tenant_id</text><polyline class="e" points="738,240 754,240 754,206 768,206" marker-end="url(#ah-tenancy)"/><rect class="n" x="770" y="230" width="196" height="32" rx="6" stroke-width="1.25"/><text class="t" x="868.0" y="250.5" font-size="12" text-anchor="middle">Cache · keys t:{id}:…</text><polyline class="e" points="738,240 754,240 754,246 768,246" marker-end="url(#ah-tenancy)"/><rect class="n" x="770" y="270" width="196" height="32" rx="6" stroke-width="1.25"/><text class="t" x="868.0" y="290.5" font-size="12" text-anchor="middle">Files · /t/{id}/ · tenant key</text><polyline class="e" points="738,240 754,240 754,286 768,286" marker-end="url(#ah-tenancy)"/><rect class="n" x="770" y="310" width="196" height="32" rx="6" stroke-width="1.25"/><text class="t" x="868.0" y="330.5" font-size="12" text-anchor="middle">Events · tenant_id in envelope</text><polyline class="e" points="738,240 754,240 754,326 768,326" marker-end="url(#ah-tenancy)"/><rect class="g" x="410" y="378" width="570" height="84" rx="8" stroke-width="1.25"/><text class="t" x="422" y="398" font-size="13">Cell IN-2 · India region · dedicated</text><text class="s" x="422" y="414" font-size="12">one enterprise tenant: same code, same schema, own database and keys</text><text class="s" x="422" y="448" font-size="12" text-anchor="start">A tenant moves between cells by migrating its data, never by changing code.</text><polyline class="e" points="360,240 384,240 384,250 408,250" marker-end="url(#ah-tenancy)"/><text class="s" x="280" y="306" font-size="12" text-anchor="middle">routes to the home cell</text><polyline class="e" points="360,262 384,262 384,420 408,420" marker-end="url(#ah-tenancy)"/><polyline class="ed" points="560,73 700,73 700,148" marker-end="url(#ah-tenancy)"/><text class="s" x="706" y="100" font-size="12" text-anchor="start">provision · config · releases</text></svg>