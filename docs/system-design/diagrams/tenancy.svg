<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Multi-Tenant Isolation Architecture: Request resolution, FastAPI dependency injection, SET LOCAL app.tenant_id, dual-role hrms_app, and PostgreSQL 16 Row-Level Security." font-family="'Noto Sans',system-ui,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff;stroke:#d5dde1}
    .n{fill:#f4f6f7;stroke:#7b8a92}
    .na{fill:#ddeaea;stroke:#0d6b6b}
    .nb{fill:#eff6ff;stroke:#3b82f6}
    .np{fill:#eceff1;stroke:#7b8a92}
    .g{fill:none;stroke:#9aa7ae;stroke-dasharray:6 5}
    .t{fill:#16222a;font-weight:600}
    .s{fill:#4f5e67}
    .ta{fill:#0d6b6b;font-weight:600}
    .tb{fill:#1e40af;font-weight:600}
    .e{fill:none;stroke:#4f5e67;stroke-width:1.5}
    .ed{fill:none;stroke:#4f5e67;stroke-width:1.5;stroke-dasharray:5 4}
    .ah{fill:#4f5e67}
  </style>
  <defs>
    <marker id="ah-tenancy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0.5" y="0.5" width="1099" height="499" rx="10"/>

  <!-- TITLE & HEADER -->
  <text class="t" x="30" y="32" font-size="14">Multi-Tenant Isolation Architecture &amp; Dual-Role RLS Enforcement</text>
  <text class="s" x="30" y="50" font-size="12">How tenant context flows from the client token to PostgreSQL 16 Row-Level Security, failing closed at every layer.</text>

  <!-- STEP 1: CLIENT REQUEST -->
  <rect class="n" x="30" y="100" width="200" height="90" rx="6" stroke-width="1.25"/>
  <text class="t" x="130" y="125" font-size="13" text-anchor="middle">1. Client Request</text>
  <text class="s" x="130" y="145" font-size="11" text-anchor="middle">HTTP REST Request</text>
  <text class="s" x="130" y="162" font-size="11" text-anchor="middle">Authorization: Bearer &lt;JWT&gt;</text>
  <text class="s" x="130" y="178" font-size="10" text-anchor="middle">(Claims: tenant_id, sub, roles)</text>

  <!-- STEP 2: FASTAPI GATEWAY & AUTHN -->
  <rect class="nb" x="280" y="100" width="240" height="90" rx="6" stroke-width="1.25"/>
  <text class="tb" x="400" y="125" font-size="13" text-anchor="middle">2. FastAPI Token Decoder</text>
  <text class="s" x="400" y="145" font-size="11" text-anchor="middle">core/authn.py: get_current_principal</text>
  <text class="s" x="400" y="162" font-size="10" text-anchor="middle">Verifies signature &amp; expiry</text>
  <text class="s" x="400" y="178" font-size="10" text-anchor="middle">Extracts immutable Principal</text>

  <polyline class="e" points="230,145 278,145" marker-end="url(#ah-tenancy)"/>

  <!-- STEP 3: SESSION DEPENDENCY & CONTEXT SETTING -->
  <rect class="na" x="570" y="80" width="250" height="130" rx="6" stroke-width="1.25"/>
  <text class="ta" x="695" y="105" font-size="13" text-anchor="middle">3. Async Session Setup</text>
  <text class="s" x="695" y="125" font-size="11" text-anchor="middle">core/database.py: get_session(tid)</text>
  <text class="t" x="695" y="145" font-size="10" text-anchor="middle">SELECT set_config('app.tenant_id', :tid, true)</text>
  <text class="s" x="695" y="165" font-size="10" text-anchor="middle">Live DB suspension verification:</text>
  <text class="s" x="695" y="180" font-size="10" text-anchor="middle">SELECT status FROM tenants WHERE id = :tid</text>
  <text class="s" x="695" y="195" font-size="9" text-anchor="middle">(If suspended, throws 403 instantly)</text>

  <polyline class="e" points="520,145 568,145" marker-end="url(#ah-tenancy)"/>

  <!-- STEP 4: DATABASE ENGINE & RLS ENFORCEMENT -->
  <rect class="na" x="870" y="80" width="200" height="130" rx="6" stroke-width="1.25"/>
  <text class="ta" x="970" y="105" font-size="13" text-anchor="middle">4. PostgreSQL 16 RLS</text>
  <text class="s" x="970" y="125" font-size="11" text-anchor="middle">Role: hrms_app (unprivileged)</text>
  <text class="t" x="970" y="145" font-size="10" text-anchor="middle">NOSUPERUSER, NOBYPASSRLS</text>
  <text class="s" x="970" y="165" font-size="10" text-anchor="middle">Engine evaluates RLS policy:</text>
  <text class="t" x="970" y="180" font-size="10" text-anchor="middle">WHERE tenant_id =</text>
  <text class="t" x="970" y="195" font-size="10" text-anchor="middle">current_setting('app.tenant_id')</text>

  <polyline class="e" points="820,145 868,145" marker-end="url(#ah-tenancy)"/>

  <!-- LOWER SECTION: THE TWO SPECIAL ISOLATION CASES -->
  <rect class="g" x="30" y="240" width="1040" height="230" rx="8" stroke-width="1.25"/>
  <text class="t" x="45" y="262" font-size="13">Special Architectural Protections</text>

  <!-- Pre-Auth Protection -->
  <rect class="n" x="45" y="278" width="490" height="174" rx="6" stroke-width="1.25"/>
  <text class="t" x="60" y="302" font-size="12">Case A: Pre-Auth Login Isolation (`get_anonymous_session`)</text>
  <text class="s" x="60" y="322" font-size="11">Before authentication, the tenant is unknown (`POST /v1/auth/login`).</text>
  <text class="s" x="60" y="342" font-size="11">• app.tenant_id is left deliberately UNSET in the database session.</text>
  <text class="s" x="60" y="362" font-size="11">• Because RLS is active on user_accounts, normal SELECT queries return zero rows.</text>
  <text class="s" x="60" y="382" font-size="11">• Login handler executes only the `login_lookup(:identifier)` function.</text>
  <text class="s" x="60" y="402" font-size="11">• `login_lookup()` is a SECURITY DEFINER function returning only password_hash,</text>
  <text class="s" x="60" y="418" font-size="11">  tenant_id, and account_id. No other tenant data is exposed.</text>
  <text class="ta" x="60" y="438" font-size="11">✓ Zero possibility of unauthenticated tenant data leakage.</text>

  <!-- Developer Mistake Resistance -->
  <rect class="n" x="555" y="278" width="500" height="174" rx="6" stroke-width="1.25"/>
  <text class="t" x="570" y="302" font-size="12">Case B: Defense-in-Depth Against Code Bugs (`hrms_app` Role)</text>
  <text class="s" x="570" y="322" font-size="11">In standard ORM frameworks, a developer forgetting `WHERE tenant_id = ...` leaks data.</text>
  <text class="s" x="570" y="342" font-size="11">• In HRMS, the application connects as `hrms_app` (migration 0005).</text>
  <text class="s" x="570" y="362" font-size="11">• `hrms_app` has `NOBYPASSRLS` and does NOT own the tables (owned by `hrms`).</text>
  <text class="s" x="570" y="382" font-size="11">• Even if an application query executes `SELECT * FROM employments;` without a WHERE clause,</text>
  <text class="s" x="570" y="398" font-size="11">  PostgreSQL's internal query planner forcibly injects the RLS filter.</text>
  <text class="s" x="570" y="418" font-size="11">• All primary keys are composite `(tenant_id, id)`, mathematically blocking cross-tenant joins.</text>
  <text class="ta" x="570" y="438" font-size="11">✓ Multi-tenancy is enforced by the database engine itself.</text>
</svg>