services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hrms-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # Localhost only: Prometheus has no authentication of its own.
      - "--web.listen-address=127.0.0.1:9090"

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: hrms-blackbox
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox.yml:ro
    command: ["--config.file=/etc/blackbox.yml", "--web.listen-address=127.0.0.1:9115"]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: hrms-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro,rslave
      - ${HRMS_MONITORING_TEXTFILE_DIR:-/srv/hrms-monitoring}:/textfiles:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/rootfs"
      - "--collector.textfile.directory=/textfiles"
      - "--web.listen-address=127.0.0.1:9100"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: hrms-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Required: no default. Applies when Grafana's database is first created; on an existing
      # install change it with `grafana cli admin reset-admin-password`.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3100
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hrms-alertmanager
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=127.0.0.1:9093"
      - "--cluster.listen-address="

volumes:
  alertmanager_data:
  prometheus_data:
  grafana_data:
