# Alert rules for the HRMS API. Thresholds follow docs/performance-baseline-2026-09-30.md
# (p95 < 300 ms for reads). Every alert links to what to do in docs/OBSERVABILITY.md.
groups:
  - name: hrms-api
    rules:
      - alert: HrmsApiDown
        expr: up{job="hrms-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "HRMS API instance {{ $labels.instance }} is not answering scrapes"
          runbook_url: "docs/OBSERVABILITY.md#hrmsapidown"

      - alert: HrmsNotReady
        expr: probe_success{job="hrms-ready"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} reports not ready (database unreachable or migrations pending)"
          runbook_url: "docs/OBSERVABILITY.md#hrmsnotready"

      - alert: HrmsHighErrorRate
        expr: |
          sum by (environment) (rate(hrms_http_requests_total{job="hrms-api",status=~"5.."}[5m]))
            / sum by (environment) (rate(hrms_http_requests_total{job="hrms-api"}[5m])) > 0.01
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "More than 1% of API requests are failing with 5xx ({{ $value | humanizePercentage }})"
          runbook_url: "docs/OBSERVABILITY.md#hrmshigherrorrate"

      - alert: HrmsSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le, environment) (rate(hrms_http_request_duration_seconds_bucket{job="hrms-api",route!~"/health.*|/metrics"}[5m]))
          ) > 0.3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "API p95 latency is {{ $value | humanizeDuration }} (target 300 ms)"
          runbook_url: "docs/OBSERVABILITY.md#hrmsslowresponses"

      - alert: HrmsDatabasePoolSaturated
        expr: max by (instance) (hrms_db_pool_checked_out / hrms_db_pool_limit) > 0.8
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} is using {{ $value | humanizePercentage }} of its database connections"
          runbook_url: "docs/OBSERVABILITY.md#hrmsdatabasepoolsaturated"

      - alert: HrmsQueryCountRegression
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(hrms_db_statements_per_request_bucket{job="hrms-api"}[15m]))
          ) > 50
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.route }} runs ~{{ $value }} SQL statements per request (p95) — likely an N+1 loop"
          runbook_url: "docs/OBSERVABILITY.md#hrmsquerycountregression"

  - name: hrms-security
    rules:
      - alert: HrmsLoginLockoutSpike
        expr: sum(increase(hrms_http_requests_total{job="hrms-api",route="/v1/auth/login",status="429"}[10m])) > 20
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} sign-in lockouts in 10 minutes — possible password guessing"
          runbook_url: "docs/OBSERVABILITY.md#hrmsloginlockoutspike"

      - alert: HrmsLoginFailureSpike
        expr: sum(increase(hrms_http_requests_total{job="hrms-api",route="/v1/auth/login",status="401"}[10m])) > 100
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} failed sign-ins in 10 minutes"
          runbook_url: "docs/OBSERVABILITY.md#hrmsloginlockoutspike"

  - name: hrms-jobs
    rules:
      - alert: HrmsAccrualFailed
        expr: sum(increase(hrms_http_requests_total{job="hrms-api",route="/v1/leave/accrual/run",status=~"5.."}[1h])) > 0
        labels: {severity: critical}
        annotations:
          summary: "A monthly leave accrual run failed — balances were not credited"
          runbook_url: "docs/OBSERVABILITY.md#hrmsaccrualfailed"

      - alert: HrmsScheduledActionsFailing
        expr: sum(increase(hrms_scheduled_personnel_actions_total{job="hrms-api",outcome="failed"}[1h])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} scheduled personnel action(s) could not be applied and were parked as FAILED"
          runbook_url: "docs/OBSERVABILITY.md#hrmsscheduledactionsfailing"

      # hrms.jobs records every run in job_runs; /metrics exports each job's last success.
      - alert: HrmsJobStale
        expr: time() - hrms_job_last_success_timestamp_seconds{job_name!="mail-delivery"} > 26 * 3600
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "Scheduled job {{ $labels.job_name }} has not succeeded for over a day — leave balances or personnel changes are falling behind"
          runbook_url: "docs/OBSERVABILITY.md#hrmsjobstale"

      - alert: HrmsJobNeverRan
        expr: hrms_job_last_success_timestamp_seconds == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "No scheduled job has ever succeeded — is the jobs container running?"
          runbook_url: "docs/OBSERVABILITY.md#hrmsjobstale"

      - alert: HrmsPublicSiteDown
        expr: probe_success{job="hrms-public"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is unreachable from outside (Cloudflare tunnel, DNS or the service behind it)"
          runbook_url: "docs/OBSERVABILITY.md#hrmspublicsitedown"

  - name: hrms-backups
    rules:
      - alert: HrmsBackupStale
        expr: time() - hrms_backup_last_success_timestamp_seconds > 26 * 3600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.environment }} has no verified recent database backup"
      - alert: HrmsBackupMonitoringMissing
        expr: absent(hrms_backup_last_success_timestamp_seconds)
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "Backup-age exporter is not configured or no longer running"
      - alert: HrmsOffsiteBackupStale
        expr: time() - hrms_offsite_backup_last_success_timestamp_seconds > 26 * 3600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.environment }} off-site backup copy is overdue"
      - alert: HrmsOffsiteBackupMonitoringMissing
        expr: absent(hrms_offsite_backup_last_success_timestamp_seconds)
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "No off-site backup confirmation is being exported"
      - alert: HrmsHostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "HRMS host has less than 10% available memory"

      - alert: HrmsHostDiskPressure
        expr: node_filesystem_avail_bytes{job="hrms-host",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="hrms-host",fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.mountpoint }} has less than 15% disk space available"

      - alert: HrmsResetDeliveryStale
        expr: time() - hrms_job_last_success_timestamp_seconds{job_name="mail-delivery"} > 300
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Password recovery delivery worker has not succeeded for five minutes"

  # Connected apps (docs/erp-crm-integration-plan.md §12). Gauges come from integration_health().
  - name: hrms-integrations
    rules:
      - alert: HrmsIntegrationRejectRateHigh
        expr: |
          sum by (app) (rate(hrms_integration_requests_total{outcome=~"REJECTED|FAILED"}[15m]))
            / sum by (app) (rate(hrms_integration_requests_total[15m])) > 0.1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.app }}: more than 10% of sync calls are refused or failing"
          runbook_url: "docs/OBSERVABILITY.md#hrmsintegrationrejectratehigh"

      - alert: HrmsIntegrationFeedLagging
        expr: |
          hrms_integration_feed_lag_events > 0
            and (time() - hrms_integration_feed_last_read_timestamp_seconds) > 900
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.tenant }}/{{ $labels.app }} has {{ $value }} unread events and hasn't polled for 15 minutes"
          runbook_url: "docs/OBSERVABILITY.md#hrmsintegrationfeedlagging"

      - alert: HrmsIntegrationExitsHeld
        expr: hrms_integration_held_exits > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.tenant }}/{{ $labels.app }}: {{ $value }} exits held by the safety valve"
          runbook_url: "docs/OBSERVABILITY.md#hrmsintegrationexitsheld"

      - alert: HrmsIntegrationUnlinkedHires
        expr: hrms_integration_unlinked_hires > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.tenant }}/{{ $labels.app }}: {{ $value }} HRMS hires not linked by the app after 24 hours"
          runbook_url: "docs/OBSERVABILITY.md#hrmsintegrationunlinkedhires"

      - alert: HrmsApiKeyExpiring
        expr: |
          hrms_integration_key_expiry_timestamp_seconds > 0
            and (hrms_integration_key_expiry_timestamp_seconds - time()) < 7 * 86400
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.tenant }}/{{ $labels.app }}: an API key expires within 7 days"
          runbook_url: "docs/OBSERVABILITY.md#hrmsapikeyexpiring"

      - alert: HrmsApiKeyNewAddress
        expr: increase(hrms_integration_new_ip_total[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.app }}: an API key was used from a new address"
          runbook_url: "docs/OBSERVABILITY.md#hrmsapikeynewaddress"
