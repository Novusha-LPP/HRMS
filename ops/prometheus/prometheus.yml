# Prometheus configuration for the HRMS API.
# Docs: docs/OBSERVABILITY.md
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # Scrape the HRMS FastAPI backend metrics endpoint
  - job_name: hrms-api
    metrics_path: /metrics
    # If HRMS_METRICS_TOKEN is set in backend/.env, uncomment and supply the token below:
    # bearer_token: "your-secret-token"
    static_configs:
      - targets: ["127.0.0.1:8015"]
        labels:
          environment: production
